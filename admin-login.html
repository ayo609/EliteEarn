<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>EliteEarn – Admin Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#1a0505">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0f0f1a;--card:#1a1a2e;--card2:#22223a;--text:#f0f0ff;--text2:#8888aa;
            --border:#2a2a44;--gold:#D4A017;--gold2:#F0C030;--gold3:#FFF0A0;
            --header:linear-gradient(160deg,#0a0202 0%,#1a0505 30%,#2a0808 60%,#3a0a0a 100%);
            --input-bg:#1a1a30;--overlay:rgba(0,0,0,0.75);
        }
        html,body{font-family:'Montserrat',sans-serif;background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;color:var(--text)}
        body{display:flex;flex-direction:column;min-height:100vh;position:relative;overflow:hidden}

        /* Background particles */
        .bg-particles{position:fixed;inset:0;pointer-events:none;z-index:0}
        .bg-particle{position:absolute;border-radius:50%;background:rgba(212,160,23,0.08);animation:floatParticle 8s ease-in-out infinite}
        .bg-particle:nth-child(1){width:300px;height:300px;top:-100px;left:-80px;animation-delay:0s}
        .bg-particle:nth-child(2){width:200px;height:200px;bottom:-60px;right:-60px;animation-delay:2s}
        .bg-particle:nth-child(3){width:150px;height:150px;top:40%;right:-40px;animation-delay:4s}
        .bg-particle:nth-child(4){width:120px;height:120px;bottom:30%;left:-30px;animation-delay:6s}
        @keyframes floatParticle{0%,100%{transform:translateY(0) scale(1);opacity:0.6}50%{transform:translateY(-30px) scale(1.1);opacity:0.9}}

        .wrapper{width:100%;max-width:480px;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;z-index:1;padding:24px}

        /* Admin badge */
        .admin-badge{
            display:inline-flex;align-items:center;gap:8px;
            background:rgba(212,160,23,0.15);border:1px solid rgba(212,160,23,0.3);
            border-radius:50px;padding:8px 20px;
            font-size:11px;font-weight:800;color:var(--gold2);
            letter-spacing:2px;text-transform:uppercase;margin-bottom:32px;
        }
        .admin-badge i{font-size:16px}

        /* Shield icon */
        .shield-icon{
            width:100px;height:100px;
            background:linear-gradient(135deg,rgba(212,160,23,0.2),rgba(240,192,48,0.1));
            border-radius:50%;display:flex;align-items:center;justify-content:center;
            margin-bottom:24px;font-size:48px;color:var(--gold);
            border:2px solid rgba(212,160,23,0.3);
            animation:shieldPulse 3s ease-in-out infinite;
        }
        @keyframes shieldPulse{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,0.2)}50%{box-shadow:0 0 0 20px rgba(212,160,23,0)}}

        /* Title */
        .login-title{font-family:'Oswald',sans-serif;font-size:32px;font-weight:900;color:white;margin-bottom:6px;letter-spacing:1px}
        .login-subtitle{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:32px;letter-spacing:.5px}

        /* Form card */
        .form-card{background:var(--card);border-radius:24px;padding:28px 24px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.3);border:1px solid var(--border)}

        /* Inputs */
        .input-group{position:relative;margin-bottom:18px}
        .input-group input{width:100%;height:56px;padding:0 48px 0 50px;background:var(--input-bg);border:1.5px solid var(--border);border-radius:16px;font-size:14px;font-weight:600;color:var(--text);outline:none;font-family:'Montserrat',sans-serif;transition:all .3s}
        .input-group input::placeholder{color:var(--text2);font-weight:500;font-size:13px}
        .input-group input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,160,23,0.15)}
        .input-group i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:1.3rem;transition:all .3s;pointer-events:none}
        .input-group input:focus+i{color:var(--gold)}
        .eye-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text2);background:none;border:none;padding:8px;font-size:1.2rem;z-index:10;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
        .eye-toggle:hover{color:var(--gold);background:rgba(212,160,23,0.1)}

        /* Login button */
        .login-btn{width:100%;height:56px;background:linear-gradient(135deg,var(--gold),#B8960A);border:none;border-radius:16px;font-size:15px;font-weight:800;color:#1a0505;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all .3s;font-family:'Montserrat',sans-serif;letter-spacing:1px;text-transform:uppercase;box-shadow:0 6px 24px rgba(212,160,23,0.3);margin-top:4px}
        .login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(212,160,23,0.4)}
        .login-btn:active{transform:scale(.97)}
        .login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

        /* Error message */
        .error-msg{text-align:center;font-size:12px;font-weight:700;color:#EF4444;min-height:20px;margin-top:12px}

        /* Back link */
        .back-link{text-align:center;margin-top:20px}
        .back-link a{font-size:12px;font-weight:700;color:var(--text2);text-decoration:none;transition:color .2s;display:inline-flex;align-items:center;gap:6px}
        .back-link a:hover{color:var(--gold)}

        /* Spinner */
        .spinner{width:20px;height:20px;border:3px solid rgba(26,5,5,0.3);border-top-color:#1a0505;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Toast */
        .toast-wrap{position:fixed;top:20px;left:20px;z-index:500;display:flex;flex-direction:column;gap:8px}
        .toast{background:var(--card);border-radius:14px;padding:13px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13px;font-weight:700;color:var(--text);transform:translateX(-130%);transition:transform .4s cubic-bezier(.68,-.55,.265,1.55);max-width:280px;border-left:4px solid var(--gold)}
        .toast.show{transform:translateX(0)}.toast.success{border-left-color:#059669}.toast.error{border-left-color:#EF4444}

        @media(max-width:400px){.shield-icon{width:80px;height:80px;font-size:38px}.login-title{font-size:26px}}
    </style>
</head>
<body>
    <!-- Background particles -->
    <div class="bg-particles">
        <div class="bg-particle"></div>
        <div class="bg-particle"></div>
        <div class="bg-particle"></div>
        <div class="bg-particle"></div>
    </div>

    <div class="wrapper">
        <!-- Admin Badge -->
        <div class="admin-badge">
            <i class="ph ph-shield-check"></i> ADMINISTRATOR ACCESS
        </div>

        <!-- Shield Icon -->
        <div class="shield-icon">
            <i class="ph ph-shield-check"></i>
        </div>

        <!-- Title -->
        <div class="login-title">Admin Portal</div>
        <div class="login-subtitle">Secure access for EliteEarn administrators</div>

        <!-- Login Form -->
        <div class="form-card">
            <div class="input-group">
                <input type="text" id="adminUsername" placeholder="Admin Username" autocomplete="off" required>
                <i class="ph ph-user-circle"></i>
            </div>
            <div class="input-group">
                <input type="password" id="adminPassword" placeholder="Admin Password" required>
                <i class="ph ph-lock-key"></i>
                <button type="button" class="eye-toggle" onclick="togglePassword()">
                    <i class="ph ph-eye" id="eyeIcon"></i>
                </button>
            </div>
            <button class="login-btn" id="loginBtn" onclick="handleAdminLogin()">
                <span id="btnText"><i class="ph ph-sign-in"></i> SIGN IN TO ADMIN</span>
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <!-- Back to main site -->
        <div class="back-link">
            <a href="login.html"><i class="ph ph-arrow-left"></i> Back to User Login</a>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMmFqRjoZC0jbp3z_uiL6l2553YsdWjzk",
            authDomain: "earnelite-94a5e.firebaseapp.com",
            projectId: "earnelite-94a5e",
            storageBucket: "earnelite-94a5e.firebasestorage.app",
            messagingSenderId: "343677058789",
            appId: "1:343677058789:web:776faceb824158042fde0c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window._auth = auth;
        window._db = db;
        window._fbFns = { doc, getDoc, signInWithEmailAndPassword };
        window._firebaseReady = true;

        console.log('✅ Admin Firebase ready');
    </script>

    <script>
        "use strict";

        // ── Toast ──
        function showToast(msg, type = 'info') {
            const w = document.getElementById('toastWrap');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.innerHTML = msg;
            w.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 350); }, 4000);
        }

        // ── Password Toggle ──
        function togglePassword() {
            const input = document.getElementById('adminPassword');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'ph ph-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'ph ph-eye';
            }
        }

        // ── Loading State ──
        function setLoading(loading) {
            const btn = document.getElementById('loginBtn');
            const txt = document.getElementById('btnText');
            btn.disabled = loading;
            txt.innerHTML = loading ? '<span class="spinner"></span> VERIFYING...' : '<i class="ph ph-sign-in"></i> SIGN IN TO ADMIN';
        }

        // ── 🔑 ADMIN LOGIN HANDLER ──
        async function handleAdminLogin() {
            if (!window._firebaseReady || !window._db) {
                showToast('System loading, please wait...', 'info');
                return;
            }

            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!username || !password) {
                errorMsg.textContent = 'Please enter both username and password';
                return;
            }

            setLoading(true);
            errorMsg.textContent = '';

            try {
                const { doc, getDoc } = window._fbFns;
                const db = window._db;

                // 🔑 Check if admin exists in 'admins' collection
                const adminRef = doc(db, 'admins', username);
                const adminSnap = await getDoc(adminRef);

                if (!adminSnap.exists()) {
                    setLoading(false);
                    errorMsg.textContent = '❌ Invalid admin credentials';
                    showToast('Access denied: Invalid credentials', 'error');
                    return;
                }

                const adminData = adminSnap.data();

                // 🔑 Check if admin is active
                if (!adminData.isActive) {
                    setLoading(false);
                    errorMsg.textContent = '❌ This admin account has been deactivated';
                    showToast('Account deactivated', 'error');
                    return;
                }

                // 🔑 Verify password (simple hash comparison)
                const passwordHash = btoa(password + username + 'elite_admin_salt');
                if (adminData.password !== passwordHash) {
                    setLoading(false);
                    errorMsg.textContent = '❌ Invalid admin credentials';
                    showToast('Access denied: Invalid credentials', 'error');
                    return;
                }

                // 🔑 SUCCESS - Store admin session
                console.log('✅ Admin authenticated:', username);

                // Store admin session
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminUsername', username);
                sessionStorage.setItem('adminRole', adminData.role || 'admin');
                sessionStorage.setItem('adminEmail', adminData.email || '');
                sessionStorage.setItem('adminName', adminData.fullName || username);
                sessionStorage.setItem('adminData', JSON.stringify({
                    username: username,
                    fullName: adminData.fullName || username,
                    email: adminData.email || '',
                    role: adminData.role || 'admin',
                    permissions: adminData.permissions || ['all'],
                    loginTime: new Date().toISOString()
                }));

                // Update last login
                const { updateDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
                await updateDoc(adminRef, {
                    lastLogin: serverTimestamp(),
                    lastLoginDate: new Date().toISOString()
                });

                showToast(`✅ Welcome, ${adminData.fullName || username}!`, 'success');
                errorMsg.style.color = '#059669';
                errorMsg.textContent = '✓ Login successful! Redirecting...';

                // 🔑 Redirect to admin dashboard
                setTimeout(() => {
                    window.location.href = 'admin/dashboard.html';
                }, 1000);

            } catch (err) {
                setLoading(false);
                console.error('Admin login error:', err);
                errorMsg.textContent = '❌ System error. Please try again.';
                showToast('Login failed: ' + err.message, 'error');
            }
        }

        // ── Enter key support ──
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleAdminLogin();
            }
        });
        document.getElementById('adminUsername').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('adminPassword').focus();
            }
        });

        // Make functions global
        window.handleAdminLogin = handleAdminLogin;
        window.togglePassword = togglePassword;

        console.log('✅ Admin login page ready');
    </script>
</body>
</html>
