<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>EliteEarn – Profile</title>

    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="theme-color" content="#7C3AED">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f9fafb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-mobile-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 40%, #5B21B6 70%, #4C1D95 100%);
            position: relative;
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        /* Ambient glows */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.1); }
        }
        .glow-top-right { width: 280px; height: 280px; background: rgba(245,158,11,0.35); top: -60px; right: -60px; }
        .glow-bottom-left { width: 320px; height: 320px; background: rgba(139,92,246,0.4); top: 20%; left: -120px; animation-delay: 2s; }

        /* Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            pointer-events: none;
            z-index: 1;
        }
        .p1 { width: 8px; height: 8px; top: 15%; left: 10%; animation: float 6s infinite; }
        .p2 { width: 12px; height: 12px; top: 40%; right: 15%; animation: float 8s infinite 1s; }
        @keyframes float {
            0%,100%{ transform: translateY(0) translateX(0); opacity: 0.3; }
            50%{ transform: translateY(-20px) translateX(10px); opacity: 0.7; }
        }

        /* Header */
        .profile-header {
            padding: 30px 24px 30px 24px;
            color: white;
            position: relative;
            z-index: 2;
        }
        .back-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.4rem;
        }
        .edit-icon {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.2rem;
        }
        .user-info {
            margin-top: 8px;
        }
        .user-id {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .user-phone {
            font-size: 14px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main card */
        .profile-card {
            background: white;
            border-radius: 40px 40px 0 0;
            padding: 28px 20px 40px;
            margin-top: -20px;
            position: relative;
            z-index: 2;
            flex: 1;
        }

        /* Balance row */
        .topup-balance {
            background: linear-gradient(135deg, #FEF9E6, #FFF3E0);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 28px;
            text-align: center;
        }
        .topup-label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            letter-spacing: 0.5px;
        }
        .small-balance {
            font-size: 22px;
            font-weight: 700;
            color: #1f2937;
            margin: 8px 0;
        }
        .large-balance {
            font-size: 44px;
            font-weight: 800;
            color: #D97706;
            margin: 12px 0;
            line-height: 1;
        }
        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 16px;
        }
        .action-btn-profile {
            background: #8B5CF6;
            border: none;
            padding: 10px 28px;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        .action-btn-profile.outline {
            background: white;
            color: #8B5CF6;
            border: 1.5px solid #8B5CF6;
        }

        /* 3 earnings cards */
        .earnings-row {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }
        .earning-card {
            flex: 1;
            background: #f8fafc;
            border-radius: 24px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid #f0f2f5;
        }
        .earning-title {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .earning-sub {
            font-size: 9px;
            color: #9ca3af;
            margin-bottom: 8px;
        }
        .earning-amount {
            font-size: 18px;
            font-weight: 800;
            color: #1f2937;
        }

        /* Menu list - updated with proper links */
        .menu-list {
            margin: 24px 0 32px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .menu-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .menu-left i {
            font-size: 24px;
            color: #8B5CF6;
        }
        .menu-left span {
            font-weight: 600;
            font-size: 15px;
        }
        .menu-right i {
            color: #9ca3af;
            font-size: 18px;
        }
        .menu-item:active {
            background: #f9fafb;
            border-radius: 20px;
        }

        /* Sign out button */
        .signout-btn {
            width: 100%;
            background: transparent;
            border: 2px solid #EF4444;
            border-radius: 60px;
            padding: 14px;
            color: #EF4444;
            font-weight: 800;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
        }
        .signout-btn:hover {
            background: #EF4444;
            color: white;
        }

        /* Toast */
        .toast-notify {
            position: fixed;
            top: 24px;
            left: 24px;
            background: white;
            border-left: 5px solid #F59E0B;
            border-radius: 16px;
            padding: 14px 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            z-index: 300;
            transform: translateX(-120%);
            transition: transform 0.3s;
            font-weight: 600;
            max-width: 280px;
        }
        .toast-notify.show { transform: translateX(0); }
    </style>
</head>
<body>
<div class="app-mobile-wrapper">
    <div class="ambient-glow glow-top-right"></div>
    <div class="ambient-glow glow-bottom-left"></div>
    <div class="particle p1"></div>
    <div class="particle p2"></div>

    <div class="profile-header">
        <div class="back-row">
            <button class="back-btn" id="backBtn"><i class="ph ph-arrow-left"></i></button>
            <button class="edit-icon" id="editProfileBtn"><i class="ph ph-pencil-simple"></i></button>
        </div>
        <div class="user-info">
            <div class="user-id" id="userIdDisplay">ID: LOADING</div>
            <div class="user-phone"><i class="ph ph-phone"></i> <span id="userPhoneDisplay">---</span></div>
        </div>
    </div>

    <div class="profile-card">
        <!-- TOP-UP BALANCE SECTION -->
        <div class="topup-balance">
            <div class="topup-label">TOP-UP BAL</div>
            <div class="small-balance" id="smallBalance">₦0</div>
            <div class="large-balance" id="largeBalance">₦0</div>
            <div class="action-buttons">
                <a href="deposit.html" class="action-btn-profile"><i class="ph ph-arrow-down"></i> DEPOSIT ▼</a>
                <a href="withdraw.html" class="action-btn-profile outline"><i class="ph ph-arrow-up"></i> PAYOUT ▲</a>
            </div>
        </div>

        <!-- 3 EARNINGS CARDS -->
        <div class="earnings-row">
            <div class="earning-card">
                <div class="earning-title">TOTAL REVENUE</div>
                <div class="earning-sub">Lifetime Asset</div>
                <div class="earning-amount" id="totalRevenue">₦0.00</div>
            </div>
            <div class="earning-card">
                <div class="earning-title">TODAY'S YIELD</div>
                <div class="earning-sub">Product Returns</div>
                <div class="earning-amount" id="todaysYield">₦0.00</div>
            </div>
            <div class="earning-card">
                <div class="earning-title">TEAM EARNINGS</div>
                <div class="earning-sub">Active Partners</div>
                <div class="earning-amount" id="teamEarnings">₦0.00</div>
            </div>
        </div>

        <!-- MENU ITEMS - All converted to proper anchor tags with correct hrefs -->
        <div class="menu-list">
            <a href="referral.html" class="menu-item" id="referralTaskBtn">
                <div class="menu-left"><i class="ph ph-users"></i><span>Referral Task</span></div>
                <div class="menu-right"><i class="ph ph-caret-right"></i></div>
            </a>
            <a href="settlement.html" class="menu-item" id="bankSettlementBtn">
                <div class="menu-left"><i class="ph ph-bank"></i><span>Bank Settlement</span></div>
                <div class="menu-right"><i class="ph ph-caret-right"></i></div>
            </a>
            <a href="investlog.html" class="menu-item" id="investmentLogBtn">
                <div class="menu-left"><i class="ph ph-chart-line-up"></i><span>Investment log</span></div>
                <div class="menu-right"><i class="ph ph-caret-right"></i></div>
            </a>
            <a href="history.html" class="menu-item" id="recordsBtn">
                <div class="menu-left"><i class="ph ph-note"></i><span>Records</span></div>
                <div class="menu-right"><i class="ph ph-caret-right"></i></div>
            </a>
            <a href="security.html" class="menu-item" id="securityBtn">
                <div class="menu-left"><i class="ph ph-shield-check"></i><span>Security Settings</span></div>
                <div class="menu-right"><i class="ph ph-caret-right"></i></div>
            </a>
        </div>

        <!-- SECURE SIGN OUT -->
        <button class="signout-btn" id="signoutBtn"><i class="ph ph-sign-out"></i> SECURE SIGN OUT</button>
    </div>
</div>

<div id="toastMsg" class="toast-notify">✅ Message</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDMmFqRjoZC0jbp3z_uiL6l2553YsdWjzk",
        authDomain: "earnelite-94a5e.firebaseapp.com",
        projectId: "earnelite-94a5e",
        storageBucket: "earnelite-94a5e.firebasestorage.app",
        messagingSenderId: "343677058789",
        appId: "1:343677058789:web:776faceb824158042fde0c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserData = null;
    let currentUsername = "";

    // DOM elements
    const userIdSpan = document.getElementById('userIdDisplay');
    const userPhoneSpan = document.getElementById('userPhoneDisplay');
    const smallBalanceSpan = document.getElementById('smallBalance');
    const largeBalanceSpan = document.getElementById('largeBalance');
    const totalRevenueSpan = document.getElementById('totalRevenue');
    const todaysYieldSpan = document.getElementById('todaysYield');
    const teamEarningsSpan = document.getElementById('teamEarnings');

    function showToast(message, type = 'info') {
        const toast = document.getElementById('toastMsg');
        toast.innerHTML = `<i class="fa-regular fa-bell"></i> ${message}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Format currency NGN
    function formatCurrency(amount) {
        return new Intl.NumberFormat('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
    }

    // Calculate today's yield (0.5% of total deposited)
    function calculateTodaysYield(userData) {
        const totalDeposited = userData.totalDeposited || 0;
        return totalDeposited * 0.005;
    }

    // Load user profile from Firestore
    async function loadUserProfile(uid) {
        try {
            const userByUidRef = doc(db, 'usersByUid', uid);
            const userByUidSnap = await getDoc(userByUidRef);
            if (!userByUidSnap.exists()) {
                showToast("User data not found", "error");
                return;
            }
            currentUsername = userByUidSnap.data().username;
            
            const userMainRef = doc(db, 'users', currentUsername);
            const userSnap = await getDoc(userMainRef);
            if (userSnap.exists()) {
                currentUserData = userSnap.data();
            } else {
                currentUserData = {};
            }
            
            const displayId = currentUsername || uid.slice(0, 6).toUpperCase();
            userIdSpan.innerText = `ID: ${displayId}`;
            
            const phoneNumber = currentUserData.phoneNumber || currentUserData.phone || "+234 0000000000";
            userPhoneSpan.innerText = phoneNumber;
            
            const depositWallet = currentUserData.depositWallet || 0;
            const withdrawalWallet = currentUserData.withdrawalWallet || 0;
            const totalBalance = depositWallet + withdrawalWallet;
            const totalDeposited = currentUserData.totalDeposited || 0;
            const referralBonus = currentUserData.referralBonus || 0;
            const totalRevenue = totalDeposited + referralBonus;
            
            smallBalanceSpan.innerText = `₦${formatCurrency(depositWallet)}`;
            largeBalanceSpan.innerText = `₦${formatCurrency(totalBalance)}`;
            totalRevenueSpan.innerText = `₦${formatCurrency(totalRevenue)}`;
            
            const dailyYield = calculateTodaysYield(currentUserData);
            todaysYieldSpan.innerText = `₦${formatCurrency(dailyYield)}`;
            
            teamEarningsSpan.innerText = `₦${formatCurrency(referralBonus)}`;
            
        } catch (err) {
            console.error(err);
            showToast("Error loading profile", "error");
        }
    }

    function goBack() { window.location.href = "dashboard.html"; }
    function editProfile() { showToast("Edit profile feature coming soon", "info"); }

    async function handleSignOut() {
        try {
            await signOut(auth);
            showToast("Signed out successfully", "success");
            setTimeout(() => { window.location.href = "login.html"; }, 1000);
        } catch (err) {
            showToast("Error signing out", "error");
        }
    }

    // Event listeners for buttons that are not anchor tags
    document.getElementById('backBtn').addEventListener('click', goBack);
    document.getElementById('editProfileBtn').addEventListener('click', editProfile);
    document.getElementById('signoutBtn').addEventListener('click', handleSignOut);

    // Auth listener
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        await loadUserProfile(user.uid);
    });
</script>
</body>
</html>
