<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>EliteEarn – History</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
            --bg:#f5f5f7;--card:#ffffff;--card2:#f9f9fb;--text:#1a1a2e;--text2:#6b6b8a;
            --border:#ebebf0;--tx-card-bg:#f9f9fb;--tx-card-border:#ececf3;
            --filter-bg:#f0f0f5;--filter-active-bg:#ffffff;--empty-color:#aaaacc;
            --notif-bg:#ffffff;--modal-bg:#ffffff;--input-bg:#f5f5fa;
        }
        [data-theme="dark"]{
            --bg:#0e0e1a;--card:#1a1a2e;--card2:#22223a;--text:#f0f0ff;--text2:#8888aa;
            --border:#2a2a44;--tx-card-bg:#22223a;--tx-card-border:#2e2e50;
            --filter-bg:#22223a;--filter-active-bg:#2e2e50;--empty-color:#555577;
            --notif-bg:#1a1a2e;--modal-bg:#1a1a2e;--input-bg:#22223a;
        }
        html,body{font-family:'Montserrat',sans-serif;background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s}
        body{display:flex;flex-direction:column}
        .wrapper{width:100%;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;padding-bottom:90px}
        .page-header{background:linear-gradient(160deg,#2a0505 0%,#5c0f0f 45%,#7a1515 75%,#8b2020 100%);padding:18px 20px 110px;position:relative;overflow:hidden}
        .page-header::before{content:'';position:absolute;width:260px;height:260px;background:rgba(200,80,20,0.18);border-radius:50%;top:-80px;right:-70px;pointer-events:none}
        .page-header::after{content:'';position:absolute;width:180px;height:180px;background:rgba(255,180,50,0.07);border-radius:50%;bottom:10px;left:-40px;pointer-events:none}
        .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
        .logo-area{display:flex;align-items:center;gap:10px}
        .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:20px;font-weight:900;box-shadow:0 4px 12px rgba(245,158,11,.4);font-family:'Oswald',sans-serif}
        .logo-text{font-family:'Oswald',sans-serif;font-size:19px;font-weight:700;color:white;letter-spacing:.5px}
        .top-bar-actions{display:flex;gap:12px;align-items:center}
        .icon-btn{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;cursor:pointer;transition:all .2s;backdrop-filter:blur(8px);position:relative}
        .icon-btn:hover{background:rgba(255,255,255,.28)}
        .notif-dot{position:absolute;top:5px;right:5px;width:9px;height:9px;background:#EF4444;border-radius:50%;border:2px solid transparent;display:none}
        .notif-dot.active{display:block;animation:blink 1.5s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
        .header-title{text-align:center;color:white}
        .header-title h1{font-size:30px;font-weight:900;letter-spacing:.3px;margin-bottom:6px}
        .header-subtitle{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:2px;text-transform:uppercase}
        .header-subtitle i{color:#F59E0B}
        .floating-card{background:var(--card);border-radius:28px;margin:0 14px;margin-top:-80px;position:relative;z-index:5;box-shadow:0 8px 32px rgba(0,0,0,.12);overflow:hidden;transition:background .3s}
        .filter-tabs{display:flex;gap:0;background:var(--filter-bg);margin:16px 16px 0;border-radius:50px;padding:5px;transition:background .3s}
        .filter-tab{flex:1;text-align:center;padding:10px 4px;font-size:12px;font-weight:800;letter-spacing:.5px;border-radius:50px;cursor:pointer;transition:all .25s;color:var(--text2);user-select:none}
        .filter-tab.active{background:var(--filter-active-bg);color:var(--text);box-shadow:0 2px 12px rgba(0,0,0,.1)}
        .transactions-wrap{padding:16px;display:flex;flex-direction:column;gap:0}
        .tx-row-outer{display:flex;align-items:stretch;gap:12px;margin-bottom:14px;animation:fadeIn .3s ease both}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .tx-dot-col{display:flex;flex-direction:column;align-items:center;padding-top:18px}
        .tx-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
        .tx-dot.deposit{background:#D97706;box-shadow:0 0 0 3px rgba(217,119,6,.2)}
        .tx-dot.withdrawal{background:#EF4444;box-shadow:0 0 0 3px rgba(239,68,68,.2)}
        .tx-dot.pending{background:#8B5CF6;box-shadow:0 0 0 3px rgba(139,92,246,.2)}
        .tx-line{width:2px;background:var(--border);flex:1;margin-top:6px;border-radius:1px}
        .tx-card{flex:1;background:var(--tx-card-bg);border:1px solid var(--tx-card-border);border-radius:20px;padding:16px 16px 14px;transition:background .3s}
        .tx-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
        .tx-title{font-size:14px;font-weight:800;color:var(--text);line-height:1.3}
        .tx-amount{font-size:17px;font-weight:900;white-space:nowrap;font-family:'Oswald',sans-serif;letter-spacing:.3px}
        .tx-amount .currency-tag{font-size:11px;font-weight:700;margin-left:3px;opacity:.75}
        .tx-amount.deposit{color:#D97706}
        .tx-amount.withdrawal{color:#EF4444}
        .tx-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .tx-date{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--text2)}
        .tx-date i{font-size:12px}
        .tx-ref{font-size:11px;font-weight:700;color:var(--text2);font-family:'Oswald',sans-serif;letter-spacing:.5px}
        .status-pill{margin-left:auto;display:inline-flex;align-items:center;padding:4px 11px;border-radius:50px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
        .status-pill.processing{background:#FEF3C7;color:#D97706}
        .status-pill.pending{background:#EDE9FE;color:#7C3AED}
        .status-pill.completed{background:#D1FAE5;color:#059669}
        .status-pill.failed{background:#FEE2E2;color:#DC2626}
        .empty-state{text-align:center;padding:56px 24px 40px;color:var(--empty-color)}
        .empty-icon{width:80px;height:80px;background:var(--filter-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:36px;color:var(--empty-color)}
        .empty-state h3{font-size:16px;font-weight:800;margin-bottom:8px;color:var(--text)}
        .empty-state p{font-size:13px;font-weight:600;color:var(--text2);line-height:1.5}
        .empty-cta{display:inline-block;margin-top:20px;background:linear-gradient(135deg,#D97706,#B45309);color:white;padding:12px 28px;border-radius:50px;font-size:13px;font-weight:800;text-decoration:none;letter-spacing:.5px;box-shadow:0 4px 14px rgba(217,119,6,.35);transition:all .2s}
        .empty-cta:hover{transform:translateY(-2px)}
        .loading-wrap{display:flex;align-items:center;justify-content:center;padding:48px 20px;gap:12px;color:var(--text2);font-size:13px;font-weight:600}
        .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:#D97706;border-radius:50%;animation:spin .75s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .float-gift{position:fixed;bottom:100px;left:20px;width:52px;height:52px;background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(245,158,11,.4);z-index:50;border:3px solid white;animation:bounce 2s infinite}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .float-gift .badge{position:absolute;top:-4px;right:-4px;background:#EF4444;color:white;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white}
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px 24px;display:flex;justify-content:space-around;align-items:flex-end;box-shadow:0 -6px 24px rgba(0,0,0,.09);z-index:100;transition:background .3s}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-decoration:none;color:inherit;padding:4px 8px;border-radius:12px;transition:all .2s}
        .nav-item i{font-size:22px;color:#9ca3af;transition:color .2s}
        .nav-item span{font-size:10px;font-weight:700;color:#9ca3af;transition:color .2s}
        .nav-item.active i,.nav-item:hover i{color:#8B5CF6}
        .nav-item.active span,.nav-item:hover span{color:#8B5CF6}
        .nav-center{position:relative;top:-26px}
        .nav-center-btn{width:58px;height:58px;background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:24px;box-shadow:0 6px 20px rgba(245,158,11,.4);border:4px solid var(--card);cursor:pointer;transition:all .3s}
        .toast-wrap{position:fixed;top:20px;left:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
        .toast{background:var(--card);border-radius:14px;padding:13px 18px;box-shadow:0 10px 30px rgba(0,0,0,.12);font-size:13px;font-weight:700;color:var(--text);transform:translateX(-130%);transition:transform .4s cubic-bezier(.68,-.55,.265,1.55);max-width:280px;border-left:4px solid #D97706}
        .toast.show{transform:translateX(0)}.toast.success{border-left-color:#059669}.toast.error{border-left-color:#EF4444}
    </style>
</head>
<body>
<div class="wrapper">
    <div class="page-header">
        <div class="top-bar">
            <div class="logo-area"><div class="logo-icon">E</div><div class="logo-text">ELITEEARN</div></div>
            <div class="top-bar-actions">
                <button class="icon-btn" onclick="toggleTheme()"><i class="ph ph-moon" id="themeIcon"></i></button>
            </div>
        </div>
        <div class="header-title"><h1>Transaction History</h1><div class="header-subtitle"><i class="ph ph-download-simple"></i> FUNDING LEDGER</div></div>
    </div>

    <div class="floating-card">
        <div class="filter-tabs" id="filterTabs">
            <div class="filter-tab active" data-filter="all">ALL</div>
            <div class="filter-tab" data-filter="deposit">DEPOSITS</div>
            <div class="filter-tab" data-filter="withdrawal">WITHDRAWALS</div>
        </div>
        <div class="transactions-wrap" id="txWrap"><div class="loading-wrap"><div class="spinner"></div><span>Loading history...</span></div></div>
    </div>
</div>

<div class="float-gift" onclick="showToast('🎁 Gift codes coming soon!','info')"><i class="ph ph-gift"></i><span class="badge">1</span></div>

<div class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><i class="ph ph-house"></i><span>Home</span></a>
    <a href="referral.html" class="nav-item"><i class="ph ph-users"></i><span>Team</span></a>
    <div class="nav-center"><div class="nav-center-btn" onclick="window.location.href='deposit.html'"><i class="ph ph-wallet"></i></div></div>
    <a href="history.html" class="nav-item active"><i class="ph ph-clock-counter-clockwise"></i><span>History</span></a>
    <a href="profile.html" class="nav-item"><i class="ph ph-user"></i><span>Profile</span></a>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDMmFqRjoZC0jbp3z_uiL6l2553YsdWjzk",authDomain:"earnelite-94a5e.firebaseapp.com",projectId:"earnelite-94a5e",storageBucket:"earnelite-94a5e.firebasestorage.app",messagingSenderId:"343677058789",appId:"1:343677058789:web:776faceb824158042fde0c"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUid="",currentUsername="",authChecked=false;

function formatDate(ts){
    if(!ts)return"—";
    let d;if(ts.toDate)d=ts.toDate();else if(ts?.seconds)d=new Date(ts.seconds*1000);else d=new Date(ts);
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
    const day=d.getDate(),year=d.getFullYear();
    return`${day} ${months[d.getMonth()]} ${year} · ${hh}:${mm}`;
}
function statusClass(s){const v=(s||'').toLowerCase();if(v==='completed')return'completed';if(v==='processing')return'processing';if(v==='failed')return'failed';return'pending'}
function statusLabel(s){const v=(s||'').toLowerCase();if(v==='completed')return'COMPLETED';if(v==='processing')return'PROCESSING';if(v==='failed')return'FAILED';return'PENDING'}

function loadFromSession(){
    const d=sessionStorage.getItem('userData');
    if(sessionStorage.getItem('userLoggedIn')==='true'&&d){try{currentUsername=JSON.parse(d).username;return true}catch(e){}}
    return false;
}

async function fetchDeposits(){
    try{const q=query(collection(db,'deposits'),where('userId','==',currentUid),orderBy('createdAt','desc'));const s=await getDocs(q);return s.docs.map(d=>({id:d.id,type:'deposit',amount:d.data().amount||0,status:d.data().status||'pending',createdAt:d.data().createdAt,reference:d.data().referenceCode||d.id.slice(0,12).toUpperCase()}))}catch(e){return[]}
}
async function fetchWithdrawals(){
    try{const q=query(collection(db,'withdrawals'),where('userId','==',currentUid),orderBy('createdAt','desc'));const s=await getDocs(q);return s.docs.map(d=>({id:d.id,type:'withdrawal',amount:d.data().amount||0,status:d.data().status||'pending',createdAt:d.data().createdAt,reference:d.data().referenceCode||d.id.slice(0,12).toUpperCase()}))}catch(e){return[]}
}

async function renderTx(filter){
    currentFilter=filter;
    const wrap=document.getElementById('txWrap');
    wrap.innerHTML='<div class="loading-wrap"><div class="spinner"></div><span>Loading...</span></div>';
    try{
        let items=[];
        if(filter==='all'){const[d,w]=await Promise.all([fetchDeposits(),fetchWithdrawals()]);items=[...d,...w].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))}
        else if(filter==='deposit')items=await fetchDeposits();
        else items=await fetchWithdrawals();

        if(!items.length){wrap.innerHTML='<div class="empty-state"><div class="empty-icon"><i class="ph ph-inbox"></i></div><h3>No transactions yet</h3><p>Your deposit and withdrawal history<br>will appear here</p><a href="deposit.html" class="empty-cta">ADD FUNDS →</a></div>';return}

        wrap.innerHTML=items.map((tx,i)=>{
            const isDeposit=tx.type==='deposit',dc=isDeposit?'deposit':'withdrawal',ac=isDeposit?'deposit':'withdrawal';
            const prefix=isDeposit?'+':'-',fa=new Intl.NumberFormat('en-NG',{minimumFractionDigits:2}).format(tx.amount);
            const title=isDeposit?'Deposit via Bank Transfer':'Withdrawal Request',sc=statusClass(tx.status),sl=statusLabel(tx.status);
            return`<div class="tx-row-outer" style="animation-delay:${i*.05}s"><div class="tx-dot-col"><div class="tx-dot ${dc}"></div>${i<items.length-1?'<div class="tx-line"></div>':''}</div><div class="tx-card"><div class="tx-top"><span class="tx-title">${title}</span><span class="tx-amount ${ac}">${prefix}${fa}<span class="currency-tag">NGN</span></span></div><div class="tx-bottom"><span class="tx-date"><i class="ph ph-clock"></i>${formatDate(tx.createdAt)}</span><span class="tx-ref">#${tx.reference.slice(0,12)}</span><span class="status-pill ${sc}">${sl}</span></div></div></div>`;
        }).join('');
    }catch(e){console.error(e);wrap.innerHTML='<div class="empty-state"><div class="empty-icon"><i class="ph ph-warning-circle"></i></div><h3>Error loading</h3><p>Please try again</p></div>'}
}

const hasSession=loadFromSession();
onAuthStateChanged(auth,async(user)=>{
    authChecked=true;
    if(!user){if(!hasSession&&!sessionStorage.getItem('userLoggedIn')){sessionStorage.clear();window.location.href='login.html';return}return}
    currentUid=user.uid;
    try{const s=await getDoc(doc(db,'usersByUid',user.uid));if(s.exists())currentUsername=s.data().username||'User'}catch(e){}
    sessionStorage.setItem('userLoggedIn','true');
    sessionStorage.setItem('userData',JSON.stringify({username:currentUsername}));
    await renderTx('all');
});
setTimeout(()=>{if(!authChecked&&hasSession)console.log('⚠️ Auth timeout')},3000);
</script>

<script>
const st=localStorage.getItem('elite_theme')||'light';applyTheme(st);
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);const i=document.getElementById('themeIcon');if(i)i.className=t==='dark'?'ph ph-sun':'ph ph-moon';localStorage.setItem('elite_theme',t)}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme'),n=c==='dark'?'light':'dark';applyTheme(n);showToast(n==='dark'?'🌙 Dark mode on':'☀️ Light mode on','info')}
function showToast(m,t='info'){const w=document.getElementById('toastWrap'),e=document.createElement('div');e.className=`toast ${t}`;e.innerHTML=m;w.appendChild(e);setTimeout(()=>e.classList.add('show'),10);setTimeout(()=>{e.classList.remove('show');setTimeout(()=>e.remove(),350)},4000)}

let currentFilter='all';
document.getElementById('filterTabs').addEventListener('click',async(e)=>{
    const tab=e.target.closest('.filter-tab');if(!tab)return;
    const f=tab.getAttribute('data-filter');if(f===currentFilter)return;
    currentFilter=f;
    document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    await renderTx(f);
});

console.log('✅ History page ready');
</script>
</body>
</html>
