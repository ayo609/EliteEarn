<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>EliteEarn – History Ledger</title>

    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="theme-color" content="#7C3AED">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f9fafb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-mobile-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 40%, #5B21B6 70%, #4C1D95 100%);
            position: relative;
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        /* Ambient glows */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.1); }
        }
        .glow-top-right { width: 280px; height: 280px; background: rgba(245,158,11,0.35); top: -60px; right: -60px; }
        .glow-bottom-left { width: 320px; height: 320px; background: rgba(139,92,246,0.4); top: 20%; left: -120px; animation-delay: 2s; }

        /* Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            pointer-events: none;
            z-index: 1;
        }
        .p1 { width: 8px; height: 8px; top: 15%; left: 10%; animation: float 6s infinite; }
        .p2 { width: 12px; height: 12px; top: 40%; right: 15%; animation: float 8s infinite 1s; }
        @keyframes float {
            0%,100%{ transform: translateY(0) translateX(0); opacity: 0.3; }
            50%{ transform: translateY(-20px) translateX(10px); opacity: 0.7; }
        }

        /* Header */
        .page-header {
            padding: 30px 24px 40px 24px;
            color: white;
            position: relative;
            z-index: 2;
        }
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.4rem;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .page-header p {
            font-size: 13px;
            opacity: 0.8;
        }

        /* Main card */
        .history-card {
            background: white;
            border-radius: 40px 40px 0 0;
            padding: 24px 20px 40px;
            margin-top: -30px;
            position: relative;
            z-index: 2;
            flex: 1;
        }

        /* Filter tabs */
        .filter-tabs {
            display: flex;
            gap: 16px;
            background: #f3f4f6;
            padding: 6px;
            border-radius: 60px;
            margin-bottom: 28px;
        }
        .filter-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-weight: 700;
            font-size: 14px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            color: #6b7280;
        }
        .filter-tab.active {
            background: #8B5CF6;
            color: white;
            box-shadow: 0 4px 10px rgba(139,92,246,0.3);
        }

        /* Transaction list */
        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .transactions-list::-webkit-scrollbar {
            width: 4px;
        }
        .transactions-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .transactions-list::-webkit-scrollbar-thumb {
            background: #8B5CF6;
            border-radius: 10px;
        }

        /* Transaction card - exactly like screenshot */
        .tx-card {
            background: #f9fafb;
            border-radius: 28px;
            padding: 18px;
            border: 1px solid #f0f2f5;
            transition: 0.2s;
        }
        .tx-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .tx-type {
            font-weight: 800;
            font-size: 15px;
        }
        .tx-amount {
            font-size: 20px;
            font-weight: 800;
        }
        .tx-amount.positive {
            color: #10B981;
        }
        .tx-amount.negative {
            color: #EF4444;
        }
        .tx-meta {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .tx-id {
            font-family: monospace;
            font-size: 12px;
            background: #f3f4f6;
            padding: 6px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 6px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-processing { background: #FEF3C7; color: #D97706; }
        .status-completed { background: #D1FAE5; color: #059669; }
        .status-pending { background: #E0E7FF; color: #4F46E5; }
        .status-failed { background: #FEE2E2; color: #DC2626; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #9ca3af;
        }
        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Toast */
        .toast-notify {
            position: fixed;
            top: 24px;
            left: 24px;
            background: white;
            border-left: 5px solid #F59E0B;
            border-radius: 16px;
            padding: 14px 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            z-index: 300;
            transform: translateX(-120%);
            transition: transform 0.3s;
            font-weight: 600;
            max-width: 280px;
        }
        .toast-notify.show { transform: translateX(0); }

        /* Pull to refresh indicator */
        .refresh-indicator {
            text-align: center;
            font-size: 12px;
            color: #8B5CF6;
            padding: 8px;
            display: none;
        }
        .loading-spinner {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #e2e8f0;
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="app-mobile-wrapper">
    <div class="ambient-glow glow-top-right"></div>
    <div class="ambient-glow glow-bottom-left"></div>
    <div class="particle p1"></div>
    <div class="particle p2"></div>

    <div class="page-header">
        <div class="back-row">
            <button class="back-btn" id="backBtn"><i class="ph ph-arrow-left"></i></button>
            <span style="font-weight:600;">Deposit History</span>
        </div>
        <h1>FUNDING LEDGER</h1>
        <p>Track all your financial movements</p>
    </div>

    <div class="history-card">
        <!-- Filter tabs: ALL, DEPOSITS, WITHDRAWALS -->
        <div class="filter-tabs">
            <div class="filter-tab active" data-filter="all">ALL</div>
            <div class="filter-tab" data-filter="deposit">DEPOSITS</div>
            <div class="filter-tab" data-filter="withdrawal">WITHDRAWALS</div>
        </div>

        <div class="refresh-indicator" id="refreshHint">↓ Pull down to refresh</div>
        <div class="transactions-list" id="transactionsList">
            <!-- dynamic content -->
            <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-notify">✅ Message</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDMmFqRjoZC0jbp3z_uiL6l2553YsdWjzk",
        authDomain: "earnelite-94a5e.firebaseapp.com",
        projectId: "earnelite-94a5e",
        storageBucket: "earnelite-94a5e.firebasestorage.app",
        messagingSenderId: "343677058789",
        appId: "1:343677058789:web:776faceb824158042fde0c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = null;
    let currentFilter = "all"; // all, deposit, withdrawal
    let isLoading = false;

    const transactionsContainer = document.getElementById('transactionsList');
    const filterTabs = document.querySelectorAll('.filter-tab');
    const backBtn = document.getElementById('backBtn');
    const refreshHint = document.getElementById('refreshHint');

    function showToast(message, type = 'info') {
        const toast = document.getElementById('toastMsg');
        toast.innerHTML = `<i class="fa-regular fa-bell"></i> ${message}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Format date nicely: 17 MAY, 2026 · 20:37 · Monday
    function formatFullDate(timestamp) {
        if (!timestamp) return "Unknown date";
        let date;
        if (timestamp.toDate) {
            date = timestamp.toDate();
        } else if (timestamp.seconds) {
            date = new Date(timestamp.seconds * 1000);
        } else {
            date = new Date(timestamp);
        }
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        const day = date.getDate();
        const month = months[date.getMonth()];
        const year = date.getFullYear();
        const hours = date.getHours().toString().padStart(2, '0');
        const minutes = date.getMinutes().toString().padStart(2, '0');
        const weekday = days[date.getDay()];
        return `${day} ${month}, ${year} · ${hours}:${minutes} · ${weekday}`;
    }

    // format time only
    function formatTime(timestamp) {
        if (!timestamp) return "";
        let date;
        if (timestamp.toDate) date = timestamp.toDate();
        else if (timestamp.seconds) date = new Date(timestamp.seconds * 1000);
        else date = new Date(timestamp);
        return `${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
    }

    // Get status badge class
    function getStatusClass(status) {
        const s = (status || '').toLowerCase();
        if (s === 'completed') return 'status-completed';
        if (s === 'processing' || s === 'pending') return 'status-processing';
        if (s === 'failed') return 'status-failed';
        return 'status-pending';
    }

    // Get readable status
    function getStatusText(status) {
        const s = (status || '').toLowerCase();
        if (s === 'completed') return 'COMPLETED';
        if (s === 'processing') return 'PROCESSING';
        if (s === 'pending') return 'PENDING';
        if (s === 'failed') return 'FAILED';
        return 'PENDING';
    }

    // Fetch deposits from Firestore
    async function fetchDeposits() {
        if (!currentUserId) return [];
        const q = query(
            collection(db, "deposits"),
            where("userId", "==", currentUserId),
            orderBy("createdAt", "desc")
        );
        const snapshot = await getDocs(q);
        return snapshot.docs.map(doc => ({
            id: doc.id,
            type: 'deposit',
            amount: doc.data().amount || 0,
            status: doc.data().status || 'pending',
            createdAt: doc.data().createdAt,
            reference: doc.data().referenceCode || doc.id.slice(0, 12).toUpperCase(),
            senderName: doc.data().senderName || 'Bank Transfer'
        }));
    }

    // Fetch withdrawals from Firestore
    async function fetchWithdrawals() {
        if (!currentUserId) return [];
        try {
            const q = query(
                collection(db, "withdrawals"),
                where("userId", "==", currentUserId),
                orderBy("createdAt", "desc")
            );
            const snapshot = await getDocs(q);
            return snapshot.docs.map(doc => ({
                id: doc.id,
                type: 'withdrawal',
                amount: doc.data().amount || 0,
                status: doc.data().status || 'pending',
                createdAt: doc.data().createdAt,
                reference: doc.data().referenceCode || doc.id.slice(0, 12).toUpperCase(),
                method: doc.data().method || 'Bank Transfer'
            }));
        } catch (e) {
            // withdrawals collection might not exist yet
            return [];
        }
    }

    // merge and sort all transactions
    async function getAllTransactions() {
        const [deposits, withdrawals] = await Promise.all([fetchDeposits(), fetchWithdrawals()]);
        let all = [...deposits, ...withdrawals];
        all.sort((a, b) => {
            const timeA = a.createdAt?.seconds || 0;
            const timeB = b.createdAt?.seconds || 0;
            return timeB - timeA;
        });
        return all;
    }

    // Render transactions based on current filter
    async function renderTransactions() {
        if (!currentUserId) return;
        isLoading = true;
        transactionsContainer.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
        
        try {
            let transactions = [];
            if (currentFilter === 'all') {
                transactions = await getAllTransactions();
            } else if (currentFilter === 'deposit') {
                transactions = await fetchDeposits();
            } else if (currentFilter === 'withdrawal') {
                transactions = await fetchWithdrawals();
            }
            
            if (!transactions.length) {
                transactionsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="ph ph-inbox"></i>
                        <p>No transactions yet</p>
                        <small>Your deposit and withdrawal history will appear here</small>
                    </div>
                `;
                return;
            }
            
            // build HTML for each transaction
            let html = '';
            for (const tx of transactions) {
                const isDeposit = tx.type === 'deposit';
                const amountPrefix = isDeposit ? '+' : '-';
                const amountClass = isDeposit ? 'positive' : 'negative';
                const formattedAmount = new Intl.NumberFormat('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(tx.amount);
                const fullDateStr = formatFullDate(tx.createdAt);
                const timeStr = formatTime(tx.createdAt);
                const txTitle = isDeposit ? 'Deposit via Bank Transfer' : (tx.method ? `Withdrawal via ${tx.method}` : 'Withdrawal Request');
                const statusClass = getStatusClass(tx.status);
                const statusText = getStatusText(tx.status);
                const txRef = tx.reference || tx.id;
                
                html += `
                    <div class="tx-card">
                        <div class="tx-row">
                            <span class="tx-type">${txTitle}</span>
                            <span class="tx-amount ${amountClass}">${amountPrefix}₦${formattedAmount}</span>
                        </div>
                        <div class="tx-meta">
                            <span><i class="ph ph-calendar"></i> ${fullDateStr}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
                            <span class="tx-id"><i class="ph ph-hash"></i> ${txRef}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                    </div>
                `;
            }
            transactionsContainer.innerHTML = html;
        } catch (err) {
            console.error(err);
            transactionsContainer.innerHTML = `<div class="empty-state"><i class="ph ph-warning-circle"></i><p>Error loading history</p></div>`;
            showToast("Could not load transaction history", "error");
        }
        isLoading = false;
    }

    // pull-to-refresh logic (touch)
    let touchStartY = 0;
    let isRefreshing = false;
    function attachPullToRefresh() {
        const container = document.querySelector('.history-card');
        let scrollTop = 0;
        container.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            scrollTop = document.querySelector('.transactions-list')?.scrollTop || 0;
        });
        container.addEventListener('touchmove', (e) => {
            const touchY = e.touches[0].clientY;
            const diff = touchY - touchStartY;
            if (diff > 60 && scrollTop === 0 && !isRefreshing) {
                isRefreshing = true;
                refreshHint.style.display = 'block';
                refreshHint.innerText = '⟳ Refreshing...';
                setTimeout(async () => {
                    await renderTransactions();
                    refreshHint.style.display = 'none';
                    isRefreshing = false;
                    showToast("History updated", "success");
                }, 800);
                e.preventDefault();
            }
        });
        container.addEventListener('touchend', () => {
            setTimeout(() => {
                if (!isRefreshing) refreshHint.style.display = 'none';
            }, 300);
        });
    }

    // set up filter listeners
    function setupFilters() {
        filterTabs.forEach(tab => {
            tab.addEventListener('click', async () => {
                const filterValue = tab.getAttribute('data-filter');
                if (filterValue === currentFilter) return;
                currentFilter = filterValue;
                filterTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                await renderTransactions();
            });
        });
    }

    backBtn.addEventListener('click', () => {
        window.location.href = 'dashboard.html';
    });

    // Authentication + initial load
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        currentUserId = user.uid;
        await renderTransactions();
        setupFilters();
        attachPullToRefresh();
    });
</script>
</body>
</html>
