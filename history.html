<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>EliteEarn – Transaction History</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
            --bg:#f5f5f7;--card:#ffffff;--card2:#f9f9fb;--text:#1a1a2e;--text2:#6b6b8a;
            --border:#ebebf0;--tx-bg:#f9f9fb;--tx-border:#ececf3;
            --filter-bg:#f0f0f5;--empty-color:#aaaacc;
            --gold:#D97706;--green:#059669;--red:#EF4444;--purple:#7C3AED;--blue:#0EA5E9;--orange:#F59E0B;
            --header:linear-gradient(160deg,#2a0505 0%,#5c0f0f 45%,#7a1515 75%,#8b2020 100%);
        }
        [data-theme="dark"]{
            --bg:#0e0e1a;--card:#1a1a2e;--card2:#22223a;--text:#f0f0ff;--text2:#8888aa;
            --border:#2a2a44;--tx-bg:#22223a;--tx-border:#2e2e50;
            --filter-bg:#22223a;--empty-color:#555577;
        }
        html,body{font-family:'Montserrat',sans-serif;background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s}
        body{display:flex;flex-direction:column}
        .wrapper{width:100%;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;padding-bottom:90px}
        .page-header{background:var(--header);padding:16px 18px 90px;position:relative;overflow:hidden}
        .page-header::before{content:'';position:absolute;width:200px;height:200px;background:radial-gradient(circle,rgba(200,80,20,0.12) 0%,transparent 70%);top:-60px;right:-50px;pointer-events:none}
        .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
        .logo-area{display:flex;align-items:center;gap:10px}
        .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;font-weight:900;box-shadow:0 4px 12px rgba(245,158,11,.4);font-family:'Oswald',sans-serif}
        .logo-text{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:white;letter-spacing:.5px}
        .top-actions{display:flex;gap:8px}
        .icon-btn{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;cursor:pointer;transition:all .2s;backdrop-filter:blur(8px)}
        .icon-btn:hover{background:rgba(255,255,255,.28)}
        .header-title{text-align:center;color:white}
        .header-title h1{font-size:26px;font-weight:900;margin-bottom:4px}
        .header-subtitle{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:2px;text-transform:uppercase}
        .header-subtitle i{color:#F59E0B}

        /* Floating Card */
        .main-card{background:var(--card);border-radius:24px;margin:0 12px;margin-top:-70px;position:relative;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.1);overflow:hidden;transition:background .3s}

        /* Filter Tabs */
        .filter-row{display:flex;gap:4px;background:var(--filter-bg);margin:12px;border-radius:50px;padding:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
        .filter-row::-webkit-scrollbar{display:none}
        .filter-btn{flex-shrink:0;padding:9px 12px;font-size:10px;font-weight:800;border-radius:50px;cursor:pointer;transition:all .25s;color:var(--text2);user-select:none;white-space:nowrap;border:none;background:transparent;font-family:'Montserrat',sans-serif}
        .filter-btn.active{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.1)}
        .filter-btn .count{font-size:8px;opacity:.7;margin-left:3px}

        /* Stats Summary */
        .stats-mini{display:flex;gap:8px;padding:0 12px 8px}
        .stat-chip{flex:1;background:var(--card2);border-radius:10px;padding:10px 8px;text-align:center}
        .stat-chip-val{font-size:14px;font-weight:900;font-family:'Oswald',sans-serif;color:var(--text)}
        .stat-chip-lbl{font-size:8px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}

        /* Transaction List */
        .tx-list{padding:4px 12px 16px}
        .tx-item{display:flex;align-items:stretch;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);animation:slideIn .3s ease both}
        .tx-item:last-child{border-bottom:none}
        @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        /* Timeline dot */
        .tx-dot-col{display:flex;flex-direction:column;align-items:center;padding-top:2px}
        .tx-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
        .tx-dot.deposit{background:var(--gold);box-shadow:0 0 0 3px rgba(217,119,6,.15)}
        .tx-dot.withdrawal{background:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.15)}
        .tx-dot.roi{background:var(--blue);box-shadow:0 0 0 3px rgba(14,165,233,.15)}
        .tx-dot.referral{background:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
        .tx-dot.bonus{background:var(--green);box-shadow:0 0 0 3px rgba(5,150,105,.15)}
        .tx-dot.purchase{background:var(--orange);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
        .tx-line{width:2px;background:var(--border);flex:1;margin-top:3px;min-height:20px}

        /* Transaction Content */
        .tx-content{flex:1;min-width:0}
        .tx-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;gap:8px}
        .tx-type-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
        .tx-badge{display:inline-block;padding:3px 7px;border-radius:50px;font-size:8px;font-weight:800;text-transform:uppercase;white-space:nowrap;letter-spacing:.3px}
        .tx-badge.deposit{background:rgba(217,119,6,.12);color:var(--gold)}
        .tx-badge.withdrawal{background:rgba(239,68,68,.12);color:var(--red)}
        .tx-badge.roi{background:rgba(14,165,233,.12);color:var(--blue)}
        .tx-badge.referral{background:rgba(124,58,237,.12);color:var(--purple)}
        .tx-badge.bonus{background:rgba(5,150,105,.12);color:var(--green)}
        .tx-badge.purchase{background:rgba(245,158,11,.12);color:var(--orange)}
        .tx-name{font-size:12px;font-weight:700;color:var(--text)}
        .tx-amount{font-size:15px;font-weight:900;font-family:'Oswald',sans-serif;white-space:nowrap}
        .tx-amount.plus{color:var(--green)}.tx-amount.minus{color:var(--red)}
        .tx-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
        .tx-date{font-size:9px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:3px}
        .tx-date i{font-size:10px}
        .tx-ref{font-size:9px;font-weight:700;color:var(--text2);font-family:'Oswald',sans-serif;letter-spacing:.3px}
        .tx-status{font-size:8px;font-weight:800;padding:2px 6px;border-radius:50px;text-transform:uppercase;margin-left:auto}
        .tx-status.done{background:#D1FAE5;color:var(--green)}
        .tx-status.pending{background:#EDE9FE;color:var(--purple)}
        .tx-status.processing{background:#FEF3C7;color:var(--gold)}
        .tx-desc{font-size:9px;color:var(--text2);font-weight:500;margin-top:3px;line-height:1.4}

        /* Empty */
        .empty-state{text-align:center;padding:40px 20px;color:var(--empty-color)}
        .empty-icon{width:60px;height:60px;background:var(--filter-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px;color:var(--empty-color)}
        .empty-state h3{font-size:14px;font-weight:800;margin-bottom:4px;color:var(--text)}
        .empty-state p{font-size:11px;font-weight:600;color:var(--text2)}

        /* Loading */
        .loading-wrap{display:flex;align-items:center;justify-content:center;padding:40px;gap:8px;color:var(--text2);font-size:11px;font-weight:600}
        .spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:#D97706;border-radius:50%;animation:spin .7s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Bottom Nav */
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px 24px;display:flex;justify-content:space-around;align-items:flex-end;box-shadow:0 -6px 24px rgba(0,0,0,.09);z-index:100;transition:background .3s}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-decoration:none;color:inherit;padding:4px 8px;border-radius:12px;transition:all .2s}
        .nav-item i{font-size:22px;color:#9ca3af}.nav-item span{font-size:10px;font-weight:700;color:#9ca3af}
        .nav-item.active i,.nav-item:hover i{color:#8B5CF6}.nav-item.active span,.nav-item:hover span{color:#8B5CF6}
        .nav-center{position:relative;top:-26px}
        .nav-center-btn{width:58px;height:58px;background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:24px;box-shadow:0 6px 20px rgba(245,158,11,.4);border:4px solid var(--card);cursor:pointer;transition:all .3s}

        /* Toast */
        .toast-wrap{position:fixed;top:20px;left:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
        .toast{background:var(--card);border-radius:14px;padding:13px 18px;box-shadow:0 10px 30px rgba(0,0,0,.12);font-size:13px;font-weight:700;color:var(--text);transform:translateX(-130%);transition:transform .4s cubic-bezier(.68,-.55,.265,1.55);max-width:280px;border-left:4px solid #D97706}
        .toast.show{transform:translateX(0)}.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}
    </style>
</head>
<body>
<div class="wrapper">
    <!-- Header -->
    <div class="page-header">
        <div class="top-bar">
            <div class="logo-area"><div class="logo-icon">E</div><div class="logo-text">ELITEEARN</div></div>
            <div class="top-actions"><button class="icon-btn" id="themeBtn"><i class="ph ph-moon" id="themeIcon"></i></button></div>
        </div>
        <div class="header-title"><h1>Transactions</h1><div class="header-subtitle"><i class="ph ph-download-simple"></i> COMPLETE LEDGER</div></div>

    <!-- Main Card -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDMmFqRjoZC0jbp3z_uiL6l2553YsdWjzk",authDomain:"earnelite-94a5e.firebaseapp.com",projectId:"earnelite-94a5e",storageBucket:"earnelite-94a5e.firebasestorage.app",messagingSenderId:"343677058789",appId:"1:343677058789:web:776faceb824158042fde0c"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
let currentUid="",currentUsername="",allTransactions=[],currentFilter="all";

function fmt(n){return new Intl.NumberFormat('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0)}
function fmtShort(n){return n>=1000000?'₦'+(n/1000000).toFixed(1)+'M':n>=1000?'₦'+(n/1000).toFixed(1)+'K':'₦'+fmt(n)}
function fmtDate(ts){if(!ts)return"—";let d;if(ts.toDate)d=ts.toDate();else if(ts?.seconds)d=new Date(ts.seconds*1000);else d=new Date(ts);const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${d.getDate()} ${mo[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

function loadFromSession(){const d=sessionStorage.getItem('userData');if(sessionStorage.getItem('userLoggedIn')==='true'&&d){try{currentUsername=JSON.parse(d).username;return true}catch(e){}}return false}

// 🔑 FETCH ALL TRANSACTIONS
async function fetchAllTransactions(){
    const txns=[];
    
    // 💰 1. Deposits
    try{
        const qDep=query(collection(db,'deposits'),where('username','==',currentUsername),orderBy('createdAt','desc'));
        const sDep=await getDocs(qDep);
        sDep.forEach(d=>{
            const data=d.data();
            txns.push({
                id:d.id,type:'deposit',
                amount:data.amount||0,
                status:data.status||'pending',
                date:data.createdAt,
                ref:data.referenceCode||d.id.slice(0,10).toUpperCase(),
                title:'Bank Deposit',
                desc:data.senderName?`Sender: ${data.senderName}`:'',
                bankName:data.bankName||''
            });
        });
    }catch(e){console.error('Deposits:',e)}

    // 💸 2. Withdrawals
    try{
        const qWit=query(collection(db,'withdrawals'),where('username','==',currentUsername),orderBy('createdAt','desc'));
        const sWit=await getDocs(qWit);
        sWit.forEach(d=>{
            const data=d.data();
            const netAmt=data.netAmount||(data.amount?data.amount*0.85:0);
            txns.push({
                id:d.id,type:'withdrawal',
                amount:netAmt,
                grossAmount:data.amount||0,
                tax:data.tax||0,
                status:data.status||'pending',
                date:data.createdAt,
                ref:data.referenceCode||d.id.slice(0,10).toUpperCase(),
                title:'Withdrawal to Bank',
                desc:`${data.bankName||'Bank'} · Tax: ₦${fmt(data.tax||0)}`,
                bankName:data.bankName||''
            });
        });
    }catch(e){console.error('Withdrawals:',e)}

    // 📈 3. ROI Drops
    try{
        const qRoi=query(collection(db,'roiDrops'),where('username','==',currentUsername),orderBy('droppedAt','desc'));
        const sRoi=await getDocs(qRoi);
        sRoi.forEach(d=>{
            const data=d.data();
            txns.push({
                id:d.id,type:'roi',
                amount:data.amount||0,
                status:'completed',
                date:data.droppedAt,
                ref:'ROI-'+data.dayNumber,
                title:`Day ${data.dayNumber||'?'} ROI`,
                desc:`${data.planName||'Investment Plan'} · Auto-credited`,
                planName:data.planName||''
            });
        });
    }catch(e){console.error('ROI:',e)}

    // 👥 4. Referral Bonuses from notifications
    try{
        const qNot=query(collection(db,'notifications'),where('username','==',currentUsername),orderBy('timestamp','desc'));
        const sNot=await getDocs(qNot);
        sNot.forEach(d=>{
            const data=d.data();
            if(data.title&&(data.title.includes('Bonus')||data.title.includes('Referral')||data.title.includes('Commission'))){
                const amtMatch=data.msg?.match(/₦([\d,]+\.?\d*)/);
                const amt=amtMatch?parseFloat(amtMatch[1].replace(/,/g,'')):0;
                if(amt>0){
                    txns.push({
                        id:d.id,type:'referral',
                        amount:amt,status:'completed',
                        date:data.timestamp,ref:'REF-BONUS',
                        title:data.title.replace(/[🎉💰💎]/g,'').trim(),
                        desc:data.msg||''
                    });
                }
            }
        });
    }catch(e){console.error('Notifications:',e)}

    // 🎁 5. Welcome Bonus
    try{
        const userSnap=await getDoc(doc(db,'users',currentUsername));
        if(userSnap.exists()){
            const uData=userSnap.data();
            // Welcome bonus (₦500)
            if(uData.registrationDate){
                txns.push({
                    id:'welcome-'+currentUsername,type:'bonus',
                    amount:500,status:'completed',
                    date:{seconds:new Date(uData.registrationDate).getTime()/1000},
                    ref:'WELCOME',title:'🎉 Welcome Bonus',
                    desc:'New account registration bonus'
                });
            }
            // Admin funded
            if(uData.adminFunded&&uData.adminFunded>500){
                const already=txns.find(t=>t.ref==='ADMIN-FUND');
                if(!already){
                    txns.push({
                        id:'adminfund-'+currentUsername,type:'bonus',
                        amount:uData.adminFunded-500,status:'completed',
                        date:{seconds:Date.now()/1000-86400},
                        ref:'ADMIN-FUND',title:'💰 Admin Funded',
                        desc:'Admin wallet funding'
                    });
                }
            }
        }
    }catch(e){}

    // Sort by date newest first
    txns.sort((a,b)=>(b.date?.seconds||0)-(a.date?.seconds||0));
    return txns;
}

// 🔑 RENDER TRANSACTIONS
function renderTransactions(filter){
    const list=document.getElementById('txList');
    if(!list)return;
    list.innerHTML='<div class="loading-wrap"><div class="spinner"></div><span>Loading...</span></div>';

    let txns=allTransactions||[];
    
    // Apply filter
    if(filter==='deposit')txns=txns.filter(t=>t.type==='deposit');
    else if(filter==='withdrawal')txns=txns.filter(t=>t.type==='withdrawal');
    else if(filter==='roi')txns=txns.filter(t=>t.type==='roi');
    else if(filter==='referral')txns=txns.filter(t=>t.type==='referral');
    else if(filter==='bonus')txns=txns.filter(t=>t.type==='bonus');

    // Update stats
    const totalCredits=txns.filter(t=>t.type!=='withdrawal'&&t.status!=='pending').reduce((s,t)=>s+t.amount,0);
    const totalDebits=txns.filter(t=>t.type==='withdrawal').reduce((s,t)=>s+t.amount,0);
    document.getElementById('totalCredits').textContent='₦'+fmtShort(totalCredits);
    document.getElementById('totalDebits').textContent='₦'+fmtShort(totalDebits);
    document.getElementById('txCount').textContent=txns.length;

    if(!txns.length){
        const labels={all:'',deposit:'deposit',withdrawal:'withdrawal',roi:'ROI',referral:'referral',bonus:'bonus'};
        list.innerHTML=`<div class="empty-state"><div class="empty-icon"><i class="ph ph-inbox"></i></div><h3>No ${labels[filter]||''} transactions</h3><p>Your ${labels[filter]||'transaction'} history will appear here</p></div>`;
        return;
    }

    const typeLabels={deposit:'DEPOSIT',withdrawal:'WITHDRAWAL',roi:'ROI DROP',referral:'REFERRAL',bonus:'BONUS'};
    const typeIcons={deposit:'💰',withdrawal:'💸',roi:'📈',referral:'👥',bonus:'🎁'};

    list.innerHTML=txns.map((tx,i)=>{
        const isDebit=tx.type==='withdrawal';
        const prefix=isDebit?'-':'+';
        const amtClass=isDebit?'minus':'plus';
        const statusClass=tx.status==='completed'||tx.status==='approved'?'done':tx.status==='pending'?'pending':'processing';
        const statusLabel=tx.status==='completed'||tx.status==='approved'?'DONE':tx.status==='pending'?'PENDING':'ACTIVE';
        const badge=typeLabels[tx.type]||tx.type.toUpperCase();

        return`<div class="tx-item" style="animation-delay:${i*.02}s">
            <div class="tx-dot-col">
                <div class="tx-dot ${tx.type}"></div>
                ${i<txns.length-1?'<div class="tx-line"></div>':''}
            </div>
            <div class="tx-content">
                <div class="tx-header">
                    <div class="tx-type-row">
                        <span class="tx-badge ${tx.type}">${typeIcons[tx.type]||''} ${badge}</span>
                        <span class="tx-name">${tx.title}</span>
                    </div>
                    <span class="tx-amount ${amtClass}">${prefix}₦${fmt(tx.amount)}</span>
                </div>
                ${tx.desc?`<div class="tx-desc">${tx.desc}</div>`:''}
                <div class="tx-meta">
                    <span class="tx-date"><i class="ph ph-clock"></i>${fmtDate(tx.date)}</span>
                    <span class="tx-ref">#${tx.ref?.slice(0,10)||'—'}</span>
                    <span class="tx-status ${statusClass}">${statusLabel}</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

// 🔑 FILTER CLICKS
document.getElementById('filterRow').addEventListener('click',(e)=>{
    const btn=e.target.closest('.filter-btn');
    if(!btn)return;
    const filter=btn.dataset.filter;
    if(filter===currentFilter)return;
    currentFilter=filter;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderTransactions(filter);
});

// 🔑 AUTH
const hasSession=loadFromSession();
onAuthStateChanged(auth,async(user)=>{
    if(!user){if(!hasSession&&sessionStorage.getItem('userLoggedIn')!=='true'){sessionStorage.clear();window.location.href='login.html';return}return}
    currentUid=user.uid;
    try{const s=await getDoc(doc(db,'usersByUid',user.uid));if(s.exists())currentUsername=s.data().username||'User'}catch(e){}
    sessionStorage.setItem('userLoggedIn','true');
    sessionStorage.setItem('userData',JSON.stringify({username:currentUsername}));
    allTransactions=await fetchAllTransactions();
    renderTransactions('all');
});

// Theme
const savedTheme=localStorage.getItem('elite_theme')||'light';
document.documentElement.setAttribute('data-theme',savedTheme);
document.getElementById('themeIcon').className=savedTheme==='dark'?'ph ph-sun':'ph ph-moon';
document.getElementById('themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    document.getElementById('themeIcon').className=next==='dark'?'ph ph-sun':'ph ph-moon';
    localStorage.setItem('elite_theme',next);
});
</script>
</body>
</html>
