<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>EliteEarn – Deposit Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
            --bg:#0a0a14;--card:#141428;--card2:#1a1a30;--text:#f0f0ff;--text2:#8888aa;
            --border:#222240;--gold:#D4A017;--gold2:#F0C030;
            --green:#059669;--red:#EF4444;--purple:#7C3AED;--blue:#0EA5E9;--orange:#F59E0B;
            --header:linear-gradient(160deg,#0a0202 0%,#1a0505 30%,#2a0808 60%,#3a0a0a 100%);
            --overlay:rgba(0,0,0,0.85);--modal-bg:#141428;--input-bg:#1a1a30;
        }
        html,body{font-family:'Montserrat',sans-serif;background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;color:var(--text)}
        body{display:flex;flex-direction:column}
        .wrapper{width:100%;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;padding-bottom:20px}
        .page-header{background:var(--header);padding:16px 18px 24px;position:relative;overflow:hidden}
        .page-header::before{content:'';position:absolute;width:180px;height:180px;background:radial-gradient(circle,rgba(5,150,105,0.1) 0%,transparent 70%);top:-30px;right:-30px}
        .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
        .back-btn{background:rgba(255,255,255,0.1);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;cursor:pointer;transition:all .2s;text-decoration:none}
        .page-title{font-size:20px;font-weight:900;color:white;font-family:'Oswald',sans-serif}
        .header-badge{font-size:9px;font-weight:800;color:var(--green);background:rgba(5,150,105,0.15);padding:4px 10px;border-radius:50px;text-transform:uppercase}
        .filter-tabs{display:flex;gap:0;background:rgba(255,255,255,0.05);border-radius:12px;padding:4px}
        .filter-tab{flex:1;text-align:center;padding:10px 6px;border-radius:10px;font-size:11px;font-weight:800;cursor:pointer;transition:all .2s;color:var(--text2);user-select:none}
        .filter-tab.active{background:var(--gold);color:#1a0505}
        .filter-tab.pending-count{color:var(--orange)}
        .stats-bar{display:flex;gap:8px;padding:0 14px;margin-top:-10px;position:relative;z-index:2}
        .stat-mini{flex:1;background:var(--card);border-radius:14px;padding:12px 10px;text-align:center;border:1px solid var(--border)}
        .stat-mini-val{font-size:16px;font-weight:900;font-family:'Oswald',sans-serif;color:var(--text)}
        .stat-mini-lbl{font-size:8px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
        .content{padding:14px;display:flex;flex-direction:column;gap:10px}
        .deposit-card{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--border);cursor:pointer;transition:all .2s;position:relative}
        .deposit-card:hover{border-color:var(--gold)}
        .deposit-card.pending{border-left:3px solid var(--orange)}
        .deposit-card.approved{border-left:3px solid var(--green)}
        .deposit-card.rejected{border-left:3px solid var(--red)}
        .deposit-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
        .deposit-avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:white;font-family:'Oswald',sans-serif;flex-shrink:0;background:var(--purple)}
        .deposit-info{flex:1;min-width:0}
        .deposit-user{font-size:13px;font-weight:800;color:var(--text);margin-bottom:2px}
        .deposit-ref{font-size:10px;color:var(--text2);font-weight:600;font-family:'Oswald',sans-serif}
        .deposit-status{font-size:9px;font-weight:800;padding:3px 8px;border-radius:50px;text-transform:uppercase}
        .deposit-status.pending{background:rgba(245,158,11,0.15);color:var(--orange)}
        .deposit-status.approved{background:rgba(5,150,105,0.15);color:var(--green)}
        .deposit-status.rejected{background:rgba(239,68,68,0.15);color:var(--red)}
        .deposit-details{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
        .deposit-detail{font-size:9px;color:var(--text2);font-weight:600}
        .deposit-detail b{color:var(--text);display:block;font-size:11px}
        .deposit-actions{display:flex;gap:6px}
        .deposit-action-btn{flex:1;padding:8px 6px;border-radius:10px;border:1px solid var(--border);font-size:9px;font-weight:800;cursor:pointer;text-align:center;transition:all .2s;font-family:'Montserrat',sans-serif;background:var(--card2);color:var(--text2)}
        .deposit-action-btn.approve{color:var(--green);border-color:rgba(5,150,105,0.3)}
        .deposit-action-btn.approve:hover{background:rgba(5,150,105,0.1)}
        .deposit-action-btn.reject{color:var(--red);border-color:rgba(239,68,68,0.3)}
        .deposit-action-btn.reject:hover{background:rgba(239,68,68,0.1)}
        .deposit-action-btn.view{color:var(--blue);border-color:rgba(14,165,233,0.3)}
        .empty-state{text-align:center;padding:40px;color:var(--text2)}
        .empty-state i{font-size:48px;margin-bottom:12px;opacity:.4}
        .modal-overlay{position:fixed;inset:0;background:var(--overlay);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
        .modal-overlay.open{opacity:1;pointer-events:all}
        .modal-box{background:var(--modal-bg);border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:0 0 30px;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,0.4);max-height:85vh;overflow-y:auto}
        .modal-overlay.open .modal-box{transform:translateY(0)}
        .modal-drag{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
        .modal-hdr{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .modal-hdr h3{font-size:16px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
        .modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px}
        .modal-body{padding:16px 20px}
        .detail-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
        .detail-lbl{font-size:11px;font-weight:600;color:var(--text2)}
        .detail-val{font-size:13px;font-weight:800;color:var(--text);font-family:'Oswald',sans-serif}
        .detail-val.green{color:var(--green)}.detail-val.gold{color:var(--gold)}
        .proof-image{width:100%;border-radius:12px;margin:12px 0;max-height:300px;object-fit:contain;cursor:pointer}
        .proof-placeholder{background:var(--input-bg);border-radius:12px;padding:40px;text-align:center;color:var(--text2);font-size:12px}
        .form-group{margin-bottom:14px}
        .form-label{font-size:10px;font-weight:800;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px}
        .form-input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;color:var(--text);font-family:'Montserrat',sans-serif;outline:none}
        .form-input:focus{border-color:var(--gold)}
        textarea.form-input{resize:vertical;min-height:80px}
        .btn-approve{width:100%;background:linear-gradient(135deg,var(--green),#047857);border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:800;color:white;cursor:pointer;transition:all .2s;font-family:'Montserrat',sans-serif;margin-bottom:8px}
        .btn-approve:hover{transform:translateY(-2px)}.btn-approve:disabled{opacity:.6;cursor:not-allowed;transform:none}
        .btn-reject{width:100%;background:linear-gradient(135deg,#EF4444,#DC2626);border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:800;color:white;cursor:pointer;transition:all .2s;font-family:'Montserrat',sans-serif}
        .btn-reject:hover{transform:translateY(-2px)}.btn-reject:disabled{opacity:.6;cursor:not-allowed}
        .badge-count{background:var(--orange);color:#1a0505;font-size:10px;font-weight:900;padding:2px 7px;border-radius:50px;margin-left:4px}
        .toast-wrap{position:fixed;top:20px;left:20px;z-index:500;display:flex;flex-direction:column;gap:8px}
        .toast{background:var(--card);border-radius:14px;padding:13px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13px;font-weight:700;color:var(--text);transform:translateX(-130%);transition:transform .4s cubic-bezier(.68,-.55,.265,1.55);max-width:280px;border-left:4px solid var(--gold)}
        .toast.show{transform:translateX(0)}.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}
        .spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,0.2);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}
        .batch-bar{display:flex;gap:8px;align-items:center;padding:8px 14px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:12px;margin-bottom:8px}
        .batch-bar span{flex:1;font-size:11px;font-weight:700;color:var(--orange)}
        .batch-btn{background:var(--green);border:none;border-radius:8px;padding:8px 14px;font-size:10px;font-weight:800;color:white;cursor:pointer;white-space:nowrap}
        .image-fullscreen{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
        .image-fullscreen img{max-width:95%;max-height:90vh;border-radius:12px}
    </style>
</head>
<body>
<div class="wrapper">
    <div class="page-header">
        <div class="top-bar">
            <a href="dashboard.html" class="back-btn"><i class="ph ph-arrow-left"></i></a>
            <span class="page-title">Deposit Management</span>
            <span class="header-badge"><i class="ph ph-arrow-down-left"></i> DEPOSITS</span>
        </div>
        <div class="filter-tabs">
            <div class="filter-tab pending-count active" data-filter="pending" onclick="switchFilter('pending',this)">PENDING <span class="badge-count" id="pendingBadge">0</span></div>
            <div class="filter-tab" data-filter="approved" onclick="switchFilter('approved',this)">APPROVED</div>
            <div class="filter-tab" data-filter="rejected" onclick="switchFilter('rejected',this)">REJECTED</div>
            <div class="filter-tab" data-filter="all" onclick="switchFilter('all',this)">ALL</div>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-mini"><div class="stat-mini-val" style="color:var(--orange)" id="pendingCount">0</div><div class="stat-mini-lbl">Pending</div></div>
        <div class="stat-mini"><div class="stat-mini-val" style="color:var(--green)" id="approvedCount">0</div><div class="stat-mini-lbl">Approved</div></div>
        <div class="stat-mini"><div class="stat-mini-val" style="color:var(--gold)" id="totalAmount">₦0</div><div class="stat-mini-lbl">Total Value</div></div>
    </div>

    <div class="content" id="depositList">
        <div style="text-align:center;padding:30px;color:var(--text2)"><div class="spinner"></div><p style="margin-top:8px;font-size:12px">Loading deposits...</p></div>
    </div>
</div>

<!-- DEPOSIT DETAIL MODAL -->
<div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeModal('detailModal')">
    <div class="modal-box"><div class="modal-drag"></div>
        <div class="modal-hdr"><h3><i class="ph ph-arrow-down-left"></i> Deposit Details</h3><button class="modal-close" onclick="closeModal('detailModal')"><i class="ph ph-x"></i></button></div>
        <div class="modal-body" id="detailBody"></div>
    </div>
</div>

<!-- APPROVE MODAL -->
<div class="modal-overlay" id="approveModal" onclick="if(event.target===this)closeModal('approveModal')">
    <div class="modal-box"><div class="modal-drag"></div>
        <div class="modal-hdr"><h3><i class="ph ph-check-circle"></i> Approve Deposit</h3><button class="modal-close" onclick="closeModal('approveModal')"><i class="ph ph-x"></i></button></div>
        <div class="modal-body">
            <div class="form-group"><label class="form-label">Admin Note</label><input type="text" class="form-input" id="approveNote" placeholder="Approval note (optional)"></div>
            <button class="btn-approve" id="approveBtn" onclick="executeApprove()"><i class="ph ph-check-circle"></i> CONFIRM APPROVAL</button>
            <button class="btn-reject" onclick="closeModal('approveModal')">CANCEL</button>
        </div>
    </div>
</div>

<!-- REJECT MODAL -->
<div class="modal-overlay" id="rejectModal" onclick="if(event.target===this)closeModal('rejectModal')">
    <div class="modal-box"><div class="modal-drag"></div>
        <div class="modal-hdr"><h3><i class="ph ph-x-circle"></i> Reject Deposit</h3><button class="modal-close" onclick="closeModal('rejectModal')"><i class="ph ph-x"></i></button></div>
        <div class="modal-body">
            <div class="form-group"><label class="form-label">Rejection Reason (Required)</label><textarea class="form-input" id="rejectReason" placeholder="Why is this deposit being rejected?"></textarea></div>
            <button class="btn-reject" id="rejectBtn" onclick="executeReject()"><i class="ph ph-x-circle"></i> CONFIRM REJECTION</button>
        </div>
    </div>
</div>

<!-- IMAGE FULLSCREEN -->
<div class="image-fullscreen" id="imageFullscreen" onclick="this.style.display='none'" style="display:none">
    <img id="fullscreenImage" src="" alt="Payment Proof">
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment, serverTimestamp, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDMmFqRjoZC0jbp3z_uiL6l2553YsdWjzk",authDomain:"earnelite-94a5e.firebaseapp.com",projectId:"earnelite-94a5e",storageBucket:"earnelite-94a5e.firebasestorage.app",messagingSenderId:"343677058789",appId:"1:343677058789:web:776faceb824158042fde0c"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
window._db=db;window._allDeposits=[];let currentFilter='pending';let selectedDeposit=null;

function fmt(n){return new Intl.NumberFormat('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0)}
function fmtShort(n){return n>=1000000?'₦'+(n/1000000).toFixed(1)+'M':n>=1000?'₦'+(n/1000).toFixed(1)+'K':'₦'+fmt(n)}
function fmtDate(ts){if(!ts)return'—';let d;if(ts.toDate)d=ts.toDate();else if(ts?.seconds)d=new Date(ts.seconds*1000);else d=new Date(ts);const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${d.getDate()} ${mo[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

if(sessionStorage.getItem('adminLoggedIn')!=='true'){window.location.href='../admin-login.html'}

async function loadDeposits(){
    try{
        const snap=await getDocs(collection(db,'deposits'));
        const deposits=snap.docs.map(d=>({id:d.id,...d.data()}));
        deposits.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
        window._allDeposits=deposits;
        updateStats();
        renderDeposits(currentFilter);
    }catch(e){console.error(e)}
}

function updateStats(){
    const deps=window._allDeposits||[];
    const pending=deps.filter(d=>d.status==='pending').length;
    const approved=deps.filter(d=>d.status==='approved').length;
    const totalAmt=deps.filter(d=>d.status==='approved').reduce((s,d)=>s+(d.amount||0),0);
    document.getElementById('pendingCount').textContent=pending;
    document.getElementById('approvedCount').textContent=approved;
    document.getElementById('totalAmount').textContent='₦'+fmtShort(totalAmt);
    document.getElementById('pendingBadge').textContent=pending;
}

window.switchFilter=function(filter,el){
    currentFilter=filter;
    document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    renderDeposits(filter);
};

function renderDeposits(filter){
    let deps=window._allDeposits||[];
    if(filter!=='all')deps=deps.filter(d=>d.status===filter);
    const list=document.getElementById('depositList');
    if(!deps.length){list.innerHTML=`<div class="empty-state"><i class="ph ph-inbox"></i><p>No ${filter==='all'?'':' '+filter} deposits found</p></div>`;return}

    // Batch approve bar for pending
    const pendingCount=deps.filter(d=>d.status==='pending').length;
    let batchHTML='';
    if(filter==='pending'&&pendingCount>0){
        batchHTML=`<div class="batch-bar"><span>${pendingCount} pending deposit${pendingCount>1?'s':''}</span><button class="batch-btn" onclick="batchApproveAll()">APPROVE ALL</button></div>`;
    }

    list.innerHTML=batchHTML+deps.map(d=>{
        const isPending=d.status==='pending',isApproved=d.status==='approved';
        return`<div class="deposit-card ${d.status||'pending'}">
            <div class="deposit-top">
                <div class="deposit-avatar">${(d.username||'U')[0].toUpperCase()}</div>
                <div class="deposit-info"><div class="deposit-user">${d.username||'Unknown'} · ${d.senderName||'—'}</div><div class="deposit-ref">Ref: ${d.referenceCode||d.id?.slice(0,12)||'—'}</div></div>
                <span class="deposit-status ${d.status||'pending'}">${(d.status||'pending').toUpperCase()}</span>
            </div>
            <div class="deposit-details">
                <div class="deposit-detail">Amount<b style="color:var(--gold)">₦${fmt(d.amount||0)}</b></div>
                <div class="deposit-detail">Bank<b>${d.bankName||'—'}</b></div>
                <div class="deposit-detail">Date<b>${fmtDate(d.createdAt)}</b></div>
            </div>
            <div class="deposit-actions">
                <button class="deposit-action-btn view" onclick="openDetailModal('${d.id}')"><i class="ph ph-eye"></i> View</button>
                ${isPending?`
                <button class="deposit-action-btn approve" onclick="openApproveModal('${d.id}')"><i class="ph ph-check-circle"></i> Approve</button>
                <button class="deposit-action-btn reject" onclick="openRejectModal('${d.id}')"><i class="ph ph-x-circle"></i> Reject</button>
                `:''}
                ${isApproved?`<span style="font-size:9px;color:var(--text2);display:flex;align-items:center;gap:4px"><i class="ph ph-check"></i> Approved by ${d.reviewedBy||'admin'}</span>`:''}
            </div>
        </div>`;
    }).join('');
}

// 👁️ Detail Modal
window.openDetailModal=function(id){
    const d=window._allDeposits.find(x=>x.id===id);if(!d)return;
    selectedDeposit=d;
    document.getElementById('detailBody').innerHTML=`
        <div class="detail-row"><span class="detail-lbl">Username</span><span class="detail-val">@${d.username||'—'}</span></div>
        <div class="detail-row"><span class="detail-lbl">Sender Name</span><span class="detail-val">${d.senderName||'—'}</span></div>
        <div class="detail-row"><span class="detail-lbl">Amount</span><span class="detail-val gold">₦${fmt(d.amount||0)}</span></div>
        <div class="detail-row"><span class="detail-lbl">Bank</span><span class="detail-val">${d.bankName||'—'}</span></div>
        <div class="detail-row"><span class="detail-lbl">Account Name</span><span class="detail-val">${d.accountName||'—'}</span></div>
        <div class="detail-row"><span class="detail-lbl">Account Number</span><span class="detail-val">${d.accountNumber||'—'}</span></div>
        <div class="detail-row"><span class="detail-lbl">Reference</span><span class="detail-val">${d.referenceCode||d.id?.slice(0,12)||'—'}</span></div>
        <div class="detail-row"><span class="detail-lbl">Status</span><span class="detail-val ${d.status==='approved'?'green':d.status==='rejected'?'':'gold'}">${(d.status||'pending').toUpperCase()}</span></div>
        <div class="detail-row"><span class="detail-lbl">Date</span><span class="detail-val">${fmtDate(d.createdAt)}</span></div>
        ${d.reviewedBy?`<div class="detail-row"><span class="detail-lbl">Reviewed By</span><span class="detail-val">${d.reviewedBy}</span></div>`:''}
        ${d.adminNote?`<div class="detail-row"><span class="detail-lbl">Admin Note</span><span class="detail-val" style="color:var(--red)">${d.adminNote}</span></div>`:''}
        ${d.proofImage?`<div style="margin-top:12px"><label class="form-label">PAYMENT PROOF</label><img src="${d.proofImage}" class="proof-image" onclick="openFullscreen('${d.proofImage}')" alt="Proof" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="proof-placeholder" style="display:none">Proof image not available</div></div>`:'<div class="proof-placeholder">No proof uploaded</div>'}
        ${d.status==='pending'?`
        <button class="btn-approve" style="margin-top:12px" onclick="closeModal('detailModal');openApproveModal('${d.id}')"><i class="ph ph-check-circle"></i> APPROVE</button>
        <button class="btn-reject" onclick="closeModal('detailModal');openRejectModal('${d.id}')"><i class="ph ph-x-circle"></i> REJECT</button>
        `:''}
    `;
    openModal('detailModal');
};

// ✅ Approve
window.openApproveModal=function(id){selectedDeposit=window._allDeposits.find(x=>x.id===id);document.getElementById('approveNote').value='';openModal('approveModal')};
window.executeApprove=async function(){
    if(!selectedDeposit)return;
    const btn=document.getElementById('approveBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Processing...';
    try{
        const note=document.getElementById('approveNote').value.trim();
        await updateDoc(doc(db,'deposits',selectedDeposit.id),{status:'approved',reviewedAt:serverTimestamp(),reviewedBy:sessionStorage.getItem('adminUsername')||'admin',adminNote:note||''});
        // Credit user's deposit wallet
        await updateDoc(doc(db,'users',selectedDeposit.username),{depositWallet:increment(selectedDeposit.amount||0)});
        // Notify user
        await addDoc(collection(db,'notifications'),{uid:selectedDeposit.userId||'',type:'deposit',title:'Deposit Approved ✅',msg:`Your deposit of ₦${fmt(selectedDeposit.amount||0)} has been approved and credited.`,timestamp:serverTimestamp(),read:false});
        // Log
        await addDoc(collection(db,'adminLogs'),{adminUsername:sessionStorage.getItem('adminUsername')||'admin',action:'approve_deposit',targetUser:selectedDeposit.username,amount:selectedDeposit.amount,note:note,createdAt:serverTimestamp()});
        const snap=await getDocs(collection(db,'deposits'));window._allDeposits=snap.docs.map(d=>({id:d.id,...d.data()}));
        window._allDeposits.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
        updateStats();renderDeposits(currentFilter);
        showToast(`✅ Deposit approved! ₦${fmt(selectedDeposit.amount||0)} credited`,'success');
        closeModal('approveModal');
    }catch(e){console.error(e);showToast('❌ Failed','error');btn.disabled=false;btn.innerHTML='<i class="ph ph-check-circle"></i> CONFIRM APPROVAL'}
};

// ❌ Reject
window.openRejectModal=function(id){selectedDeposit=window._allDeposits.find(x=>x.id===id);document.getElementById('rejectReason').value='';openModal('rejectModal')};
window.executeReject=async function(){
    if(!selectedDeposit)return;
    const reason=document.getElementById('rejectReason').value.trim();
    if(!reason){showToast('❌ Rejection reason required','error');return}
    const btn=document.getElementById('rejectBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Processing...';
    try{
        await updateDoc(doc(db,'deposits',selectedDeposit.id),{status:'rejected',reviewedAt:serverTimestamp(),reviewedBy:sessionStorage.getItem('adminUsername')||'admin',adminNote:reason});
        await addDoc(collection(db,'notifications'),{uid:selectedDeposit.userId||'',type:'deposit',title:'Deposit Rejected ❌',msg:`Your deposit of ₦${fmt(selectedDeposit.amount||0)} was rejected. Reason: ${reason}`,timestamp:serverTimestamp(),read:false});
        await addDoc(collection(db,'adminLogs'),{adminUsername:sessionStorage.getItem('adminUsername')||'admin',action:'reject_deposit',targetUser:selectedDeposit.username,amount:selectedDeposit.amount,note:reason,createdAt:serverTimestamp()});
        const snap=await getDocs(collection(db,'deposits'));window._allDeposits=snap.docs.map(d=>({id:d.id,...d.data()}));
        window._allDeposits.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
        updateStats();renderDeposits(currentFilter);
        showToast(`❌ Deposit rejected`,'success');
        closeModal('rejectModal');
    }catch(e){console.error(e);showToast('❌ Failed','error');btn.disabled=false;btn.innerHTML='<i class="ph ph-x-circle"></i> CONFIRM REJECTION'}
};

// Batch Approve
window.batchApproveAll=async function(){
    const pending=window._allDeposits.filter(d=>d.status==='pending');
    if(!pending.length){showToast('No pending deposits','info');return}
    if(!confirm(`Approve ALL ${pending.length} pending deposits?`))return;
    showToast(`⏳ Approving ${pending.length} deposits...`,'info');
    for(const d of pending){
        try{
            await updateDoc(doc(db,'deposits',d.id),{status:'approved',reviewedAt:serverTimestamp(),reviewedBy:sessionStorage.getItem('adminUsername')||'admin'});
            await updateDoc(doc(db,'users',d.username),{depositWallet:increment(d.amount||0)});
        }catch(e){console.error(e)}
    }
    const snap=await getDocs(collection(db,'deposits'));window._allDeposits=snap.docs.map(d=>({id:d.id,...d.data()}));
    window._allDeposits.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    updateStats();renderDeposits(currentFilter);
    showToast(`✅ ${pending.length} deposits approved!`,'success');
};

// Fullscreen image
window.openFullscreen=function(src){document.getElementById('fullscreenImage').src=src;document.getElementById('imageFullscreen').style.display='flex'};

loadDeposits();
</script>

<script>
function showToast(m,t='info'){const w=document.getElementById('toastWrap'),e=document.createElement('div');e.className=`toast ${t}`;e.innerHTML=m;w.appendChild(e);setTimeout(()=>e.classList.add('show'),10);setTimeout(()=>{e.classList.remove('show');setTimeout(()=>e.remove(),350)},4000)}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
</script>
</body>
