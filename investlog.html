        [data-theme="dark"]{
            --bg:#0c0c18;--card:#181830;--card2:#20203a;--text:#f0f0ff;--text2:#8888aa;
            --border:#2a2a44;--gold-bg:rgba(184,150,10,.1);--input-bg:#20203a;

        .wrapper{width:100%;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;padding-bottom:110px}

        .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
        .logo-area{display:flex;align-items:center;gap:10px}

        .header-title{text-align:center;color:white}
        .header-title h1{font-size:26px;font-weight:900;margin-bottom:6px}
        .header-subtitle{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:2px;text-transform:uppercase}

        .content{padding:0 16px 20px;margin-top:-76px;position:relative;z-index:2;display:flex;flex-direction:column;gap:14px}

        .float-gift{position:fixed;bottom:100px;left:20px;width:52px;height:52px;background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(245,158,11,.4);z-index:50;border:3px solid white;animation:bounce 2s infinite}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .float-gift .badge{position:absolute;top:-4px;right:-4px;background:#EF4444;color:white;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white}
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px 24px;display:flex;justify-content:space-around;align-items:flex-end;box-shadow:0 -6px 24px rgba(0,0,0,.09);z-index:100;transition:background .3s}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-decoration:none;color:inherit;padding:4px 8px;border-radius:12px;transition:all .2s}

        .toast-wrap{position:fixed;top:20px;left:20px;z-index:500;display:flex;flex-direction:column;gap:8px}

        .btn-sp{width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}

        .fade-up{opacity:0;transform:translateY(16px);animation:fadeUp .5s ease both}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, updateDoc, serverTimestamp, increment, orderBy, limit, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDMmFqRjoZC0jbp3z_uiL6l2553YsdWjzk",authDomain:"earnelite-94a5e.firebaseapp.com",projectId:"earnelite-94a5e",storageBucket:"earnelite-94a5e.firebasestorage.app",messagingSenderId:"343677058789",appId:"1:343677058789:web:776faceb824158042fde0c"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUid="",currentUsername="",activeInvestment=null,countdownInterval=null,authChecked=false;

function fmt(n){return new Intl.NumberFormat('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0)}
function fmtDate(ts){if(!ts)return'—';let d;if(ts.toDate)d=ts.toDate();else if(ts?.seconds)d=new Date(ts.seconds*1000);else d=new Date(ts);const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`}
function fmtDateTime(ts){if(!ts)return'—';let d;if(ts.toDate)d=ts.toDate();else if(ts?.seconds)d=new Date(ts.seconds*1000);else d=new Date(ts);const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

function loadFromSession(){
    const d=sessionStorage.getItem('userData');
    if(sessionStorage.getItem('userLoggedIn')==='true'&&d){try{currentUsername=JSON.parse(d).username;return true}catch(e){}}
    return false;
}

async function loadPage(uid){
    try{
        const us=await getDoc(doc(db,'usersByUid',uid));if(!us.exists())return;
        currentUsername=us.data().username||'';
        const ud=await getDoc(doc(db,'users',currentUsername));
        const userData=ud.exists()?ud.data():{};
        sessionStorage.setItem('userLoggedIn','true');
        sessionStorage.setItem('userData',JSON.stringify({username:currentUsername,depositWallet:userData.depositWallet||0,withdrawalWallet:userData.withdrawalWallet||0}));

        let active=null;
        if(userData.activeInvestmentId){
            const is=await getDoc(doc(db,'investments',userData.activeInvestmentId));
            if(is.exists()&&is.data().status==='active')active={id:is.id,...is.data()};
        }

        let past=[];
        try{const q=query(collection(db,'investments'),where('userId','==',uid),orderBy('startDate','desc'),limit(20));const s=await getDocs(q);past=s.docs.map(d=>({id:d.id,...d.data()})).filter(d=>d.status!=='active')}catch(e){}

        let roiDrops=[];
        if(active){try{const rq=query(collection(db,'roiDrops'),where('investmentId','==',active.id),orderBy('droppedAt','desc'),limit(30));const rs=await getDocs(rq);roiDrops=rs.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}}

        activeInvestment=active;
        renderPage(active,past,roiDrops,userData);
        if(active)await checkAndProcessROI(active);
    }catch(e){console.error(e)}
}

async function checkAndProcessROI(invest){
    if(!invest||invest.status!=='active')return;
    const now=new Date();
    const sd=invest.startDate?.toDate?invest.startDate.toDate():new Date(invest.startDate?.seconds*1000||Date.now());
    const ed=invest.endDate?.toDate?invest.endDate.toDate():new Date(invest.endDate?.seconds*1000||Date.now());
    if(now>=ed){await completeInvestment(invest);return}
    const msPerDay=86400000,elapsed=now-sd,daysPassed=Math.floor(elapsed/msPerDay);
    const alreadyEarned=invest.earned||0,expectedEarned=Math.min(daysPassed*invest.dailyProfit,invest.totalExpected-invest.price);
    const pending=expectedEarned-alreadyEarned;
    if(pending>0)await creditROI(invest,pending,daysPassed);
    const nextDrop=new Date(sd.getTime()+(daysPassed+1)*msPerDay);
    startCountdown(nextDrop,invest.dailyProfit);
}

async function creditROI(invest,amount,daysPassed){
    try{
        await updateDoc(doc(db,'users',currentUsername),{withdrawalWallet:increment(amount)});
        await updateDoc(doc(db,'investments',invest.id),{earned:increment(amount)});
        const sd=invest.startDate?.toDate?invest.startDate.toDate():new Date(invest.startDate?.seconds*1000);
        const drops=[];
        const alreadyDropped=Math.floor((invest.earned||0)/invest.dailyProfit);
        for(let d=alreadyDropped;d<daysPassed;d++){
            drops.push({investmentId:invest.id,userId:currentUid,username:currentUsername,planName:invest.planName,amount:invest.dailyProfit,dayNumber:d+1,droppedAt:Timestamp.fromDate(new Date(sd.getTime()+(d+1)*86400000)),autoProcessed:true});
        }
        for(const drop of drops)await addDoc(collection(db,'roiDrops'),drop);
        await addDoc(collection(db,'notifications'),{uid:currentUid,type:'plan',title:'Daily ROI Credited! 💰',msg:`₦${fmt(amount)} from ${invest.planName} added to withdrawal wallet.`,timestamp:serverTimestamp(),read:false});
        showROIToast(amount);
        setTimeout(()=>loadPage(currentUid),1500);
    }catch(e){console.error(e)}
}

async function completeInvestment(invest){
    try{
        const earnable=invest.totalExpected-invest.price,alreadyEarned=invest.earned||0,remaining=earnable-alreadyEarned;
        if(remaining>0){await updateDoc(doc(db,'users',currentUsername),{withdrawalWallet:increment(remaining)});await updateDoc(doc(db,'investments',invest.id),{earned:increment(remaining)})}
        await updateDoc(doc(db,'investments',invest.id),{status:'completed',completedAt:serverTimestamp()});
        await updateDoc(doc(db,'users',currentUsername),{activePlan:null,activeInvestmentId:null});
        await addDoc(collection(db,'notifications'),{uid:currentUid,type:'plan',title:'Investment Completed! 🎉',msg:`${invest.planName} matured. Total: ₦${fmt(invest.totalExpected)}.`,timestamp:serverTimestamp(),read:false});
        showToast(`🎉 ${invest.planName} completed!`,'success');
        setTimeout(()=>loadPage(currentUid),2000);
    }catch(e){console.error(e)}
}

function startCountdown(nextDrop,dailyProfit){
    if(countdownInterval)clearInterval(countdownInterval);
    const CIRC=283;
    function tick(){
        const now=new Date(),remaining=Math.max(0,Math.floor((nextDrop-now)/1000));
        const h=Math.floor(remaining/3600),m=Math.floor((remaining%3600)/60),s=remaining%60;
        const timeStr=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        const de=document.getElementById('ringDigits'),fe=document.getElementById('ringFill'),ne=document.getElementById('nextDropTime');
        if(de)de.textContent=timeStr;
        if(fe){fe.style.strokeDashoffset=CIRC*(1-remaining/86400);fe.className=remaining<3600?'ring-fill danger':'ring-fill'}
        if(ne){if(remaining<=0){ne.textContent='Dropping now...';clearInterval(countdownInterval);setTimeout(()=>loadPage(currentUid),1000)}else{ne.textContent=`${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m`}}
    }
    tick();countdownInterval=setInterval(tick,1000);
}

function showROIToast(amount){
    const t=document.getElementById('roiToast');document.getElementById('roiToastMsg').textContent=`+₦${fmt(amount)} credited to your wallet!`;
    t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4000);
}

        const now=new Date(),totalMs=ed-sd,elapsedMs=now-sd,pp=Math.min(100,Math.max(0,Math.round((elapsedMs/totalMs)*100)));
        const dt=active.days||0,dp=Math.min(dt,Math.floor(elapsedMs/86400000)),dl=Math.max(0,dt-dp);
        const earned=active.earned||0,earnable=active.totalExpected-active.price;
        const nextDropMs=new Date(sd.getTime()+(dp+1)*86400000);
        h+=`<div class="invest-card fade-up" style="animation-delay:.1s"><div class="invest-card-header"><div class="ic-top-row"><span class="ic-emoji">${active.emoji||'📦'}</span><div class="ic-product-name">${active.planName||'Plan'}</div><div class="ic-category-badge">${(active.category||'products').toUpperCase()}</div></div><div class="ic-start-date"><i class="ph ph-calendar"></i> Started: ${fmtDate(active.startDate)} · Ends: ${fmtDate(ed)}</div></div><div class="countdown-section"><div class="countdown-ring-wrap"><svg class="ring-svg" viewBox="0 0 100 100"><circle class="ring-track" cx="50" cy="50" r="45"/><circle class="ring-fill" id="ringFill" cx="50" cy="50" r="45"/></svg><div class="ring-center"><div class="ring-digits" id="ringDigits">00:00:00</div><div class="ring-lbl">next drop</div></div></div><div class="countdown-info"><div class="cd-title">NEXT ROI DROP IN</div><div class="cd-next-drop" id="nextDropTime">Calculating...</div><div class="cd-drop-label"><i class="ph ph-arrow-down-left"></i> Auto-credited:</div><div class="cd-amount">+₦${fmt(active.dailyProfit)}</div><div style="font-size:11px;font-weight:600;color:var(--text2);margin-top:4px">→ Directly to withdrawal wallet</div></div></div><div class="invest-details"><div class="detail-grid"><div class="detail-chip"><div class="dc-label">Entry Price</div><div class="dc-value">₦${fmt(active.price)}</div></div><div class="detail-chip"><div class="dc-label">Daily ROI</div><div class="dc-value green">₦${fmt(active.dailyProfit)}</div></div><div class="detail-chip"><div class="dc-label">Duration</div><div class="dc-value">${dt} days</div></div><div class="detail-chip"><div class="dc-label">Days Left</div><div class="dc-value ${dl<=5?'red':'gold'}">${dl} days</div></div><div class="detail-chip"><div class="dc-label">Earned So Far</div><div class="dc-value green">₦${fmt(earned)}</div></div><div class="detail-chip"><div class="dc-label">Total Return</div><div class="dc-value gold">₦${fmt(active.totalExpected)}</div></div></div></div><div class="progress-section"><div class="progress-header"><span class="progress-lbl">Investment Progress</span><span class="progress-pct">${pp}%</span></div><div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pp}%"></div></div><div class="progress-sub"><span class="progress-sub-txt">Day ${dp} of ${dt}</span><span class="progress-sub-txt">₦${fmt(earned)} / ₦${fmt(earnable)}</span></div></div><div class="roi-history"><div class="roi-history-title">ROI DROP HISTORY (${roiDrops.length} drops)</div>${roiDrops.length===0?'<div class="roi-empty">No drops yet. First drop 24hrs after purchase.</div>':roiDrops.map((d,i)=>`<div class="roi-drop-item" style="animation:fadeUp .4s ${i*.04}s ease both"><div class="roi-drop-icon"><i class="ph ph-arrow-down-left"></i></div><div class="roi-drop-body"><div class="roi-drop-title">Day ${d.dayNumber||i+1} ROI Drop</div><div class="roi-drop-date">${fmtDateTime(d.droppedAt)}</div></div><div class="roi-drop-amt">+₦${fmt(d.amount)}</div></div>`).join('')}</div></div>`;
        startCountdown(nextDropMs,active.dailyProfit);
    }else{
        h+=`<div class="no-invest fade-up" style="animation-delay:.1s"><div class="no-invest-icon">📊</div><h3>No Active Investment</h3><p>You don't have an active plan right now.<br>Browse our products to start earning daily ROI automatically credited to your withdrawal wallet.</p><a href="plans.html" class="browse-plans-btn"><i class="ph ph-rocket-launch"></i> Browse Plans</a></div>`;
    }

    if(past.length>0){
        h+=`<div class="past-card fade-up" style="animation-delay:.2s"><div class="past-title"><i class="ph ph-clock-counter-clockwise"></i> PAST INVESTMENTS</div>${past.map(p=>`<div class="past-item"><div class="past-icon">${p.emoji||'📦'}</div><div class="past-body"><div class="past-name">${p.planName||'Plan'}</div><div class="past-meta">${fmtDate(p.startDate)} → ${fmtDate(p.endDate||p.completedAt)} · ${p.days||0} days</div><div class="past-chips"><span class="past-chip completed">${(p.status||'expired').toUpperCase()}</span><span class="past-chip completed">₦${fmt(p.price)} invested</span></div></div><div class="past-earned"><div class="past-earned-val">₦${fmt(p.earned||0)}</div><div class="past-earned-lbl">earned</div></div></div>`).join('')}</div>`;
    }

    h+=`<div style="background:var(--card);border-radius:22px;padding:18px 20px;box-shadow:0 3px 12px rgba(0,0,0,.06);border:1px solid var(--border)" class="fade-up" style="animation-delay:.3s"><div style="font-size:12px;font-weight:800;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:6px"><i class="ph ph-info" style="color:var(--gold);font-size:18px"></i> HOW ROI WORKS</div><div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:10px;align-items:flex-start"><div style="width:28px;height:28px;min-width:28px;background:var(--gold-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--gold)">1</div><div style="font-size:12px;font-weight:600;color:var(--text2);line-height:1.6">Purchase any plan — ROI starts <strong style="color:var(--text)">24 hours</strong> after purchase.</div></div><div style="display:flex;gap:10px;align-items:flex-start"><div style="width:28px;height:28px;min-width:28px;background:var(--gold-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--gold)">2</div><div style="font-size:12px;font-weight:600;color:var(--text2);line-height:1.6">Every 24hrs, <strong style="color:var(--text)">daily profit auto-credits</strong> to withdrawal wallet.</div></div><div style="display:flex;gap:10px;align-items:flex-start"><div style="width:28px;height:28px;min-width:28px;background:var(--gold-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--gold)">3</div><div style="font-size:12px;font-weight:600;color:var(--text2);line-height:1.6">Plan matures → all earnings credited → <strong style="color:var(--text)">withdraw or reinvest</strong>.</div></div></div></div>`;
    c.innerHTML=h;
}

const hasSession=loadFromSession();
onAuthStateChanged(auth,async(user)=>{
    authChecked=true;
    if(!user){if(!hasSession&&!sessionStorage.getItem('userLoggedIn')){sessionStorage.clear();window.location.href='login.html';return}return}
    currentUid=user.uid;await loadPage(user.uid);
});
setTimeout(()=>{if(!authChecked&&hasSession)console.log('⚠️ Auth timeout')},3000);
</script>

const st=localStorage.getItem('elite_theme')||'light';applyTheme(st);
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);const i=document.getElementById('themeIcon');if(i)i.className=t==='dark'?'ph ph-sun':'ph ph-moon';localStorage.setItem('elite_theme',t)}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme'),n=c==='dark'?'light':'dark';applyTheme(n);showToast(n==='dark'?'🌙 Dark mode on':'☀️ Light mode on','info')}
function showToast(m,t='info'){const w=document.getElementById('toastWrap'),e=document.createElement('div');e.className=`toast ${t}`;e.innerHTML=m;w.appendChild(e);setTimeout(()=>e.classList.add('show'),10);setTimeout(()=>{e.classList.remove('show');setTimeout(()=>e.remove(),350)},4000)}
window.showToast=showToast;
