<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>EliteEarn – User Lookup</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
            --bg:#0a0a14;--card:#141428;--card2:#1a1a30;--text:#f0f0ff;--text2:#8888aa;
            --border:#222240;--gold:#D4A017;--gold2:#F0C030;
            --green:#059669;--red:#EF4444;--purple:#7C3AED;--blue:#0EA5E9;--orange:#F59E0B;
            --header:linear-gradient(160deg,#0a0202 0%,#1a0505 30%,#2a0808 60%,#3a0a0a 100%);
            --overlay:rgba(0,0,0,0.85);--modal-bg:#141428;--input-bg:#1a1a30;
        }
        html,body{font-family:'Montserrat',sans-serif;background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;color:var(--text)}
        body{display:flex;flex-direction:column}
        .wrapper{width:100%;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;padding-bottom:20px}
        .page-header{background:var(--header);padding:16px 18px 24px;position:relative;overflow:hidden}
        .page-header::before{content:'';position:absolute;width:180px;height:180px;background:radial-gradient(circle,rgba(14,165,233,0.08) 0%,transparent 70%);top:-30px;right:-30px}
        .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
        .back-btn{background:rgba(255,255,255,0.1);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;cursor:pointer;transition:all .2s;text-decoration:none}
        .page-title{font-size:20px;font-weight:900;color:white;font-family:'Oswald',sans-serif}
        .header-badge{font-size:9px;font-weight:800;color:var(--blue);background:rgba(14,165,233,0.15);padding:4px 10px;border-radius:50px;text-transform:uppercase}
        .search-bar{position:relative;margin-bottom:8px}
        .search-input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:12px 40px 12px 16px;font-size:13px;font-weight:600;color:white;outline:none;font-family:'Montserrat',sans-serif}
        .search-input::placeholder{color:rgba(255,255,255,0.4)}
        .search-input:focus{border-color:var(--gold)}
        .search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:18px}
        .search-results{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:8px;border:1px solid var(--border);display:none}
        .search-result-item{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .2s}
        .search-result-item:last-child{border-bottom:none}
        .search-result-item:hover{background:rgba(212,160,23,0.05)}
        .sr-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:white;font-family:'Oswald',sans-serif;flex-shrink:0}
        .sr-info{flex:1;min-width:0}
        .sr-name{font-size:12px;font-weight:800;color:var(--text)}
        .sr-sub{font-size:9px;color:var(--text2);font-weight:600}

        /* User Profile */
        .profile-card{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--border);margin-bottom:10px}
        .profile-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
        .profile-avatar{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:white;font-family:'Oswald',sans-serif;background:var(--purple);flex-shrink:0}
        .profile-info{flex:1}
        .profile-name{font-size:16px;font-weight:800;color:var(--text)}
        .profile-username{font-size:11px;color:var(--text2);font-weight:600}
        .profile-status{font-size:9px;font-weight:800;padding:3px 8px;border-radius:50px;text-transform:uppercase}
        .profile-status.active{background:rgba(5,150,105,0.15);color:var(--green)}
        .profile-status.frozen{background:rgba(239,68,68,0.15);color:var(--red)}
        .profile-details{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
        .profile-detail{font-size:9px;color:var(--text2)}
        .profile-detail b{display:block;color:var(--text);font-size:11px}

        /* Wallet Cards */
        .wallet-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
        .wallet-card{background:var(--card2);border-radius:12px;padding:12px;border:1px solid var(--border);text-align:center}
        .wallet-card-lbl{font-size:8px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
        .wallet-card-val{font-size:18px;font-weight:900;font-family:'Oswald',sans-serif}
        .wallet-card-val.deposit{color:var(--gold)}.wallet-card-val.withdraw{color:var(--green)}

        /* Tab Bar */
        .tab-bar{display:flex;gap:0;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:10px;overflow-x:auto}
        .tab-btn{flex-shrink:0;padding:8px 12px;border-radius:8px;font-size:9px;font-weight:800;cursor:pointer;transition:all .2s;color:var(--text2);user-select:none;border:none;background:transparent;font-family:'Montserrat',sans-serif;white-space:nowrap}
        .tab-btn.active{background:var(--gold);color:#1a0505}
        .tab-content{display:none}
        .tab-content.active{display:block}

        /* Transaction List */
        .tx-item{background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:6px;border-left:3px solid var(--border)}
        .tx-item.deposit{border-left-color:var(--green)}
        .tx-item.withdrawal{border-left-color:var(--red)}
        .tx-item.investment{border-left-color:var(--purple)}
        .tx-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
        .tx-title{font-size:11px;font-weight:800;color:var(--text)}
        .tx-amount{font-size:13px;font-weight:900;font-family:'Oswald',sans-serif}
        .tx-amount.green{color:var(--green)}.tx-amount.red{color:var(--red)}.tx-amount.gold{color:var(--gold)}
        .tx-meta{font-size:9px;color:var(--text2);display:flex;gap:8px}

        /* Action Buttons */
        .action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
        .action-btn{padding:10px 8px;border-radius:10px;border:1px solid var(--border);font-size:9px;font-weight:800;cursor:pointer;text-align:center;transition:all .2s;font-family:'Montserrat',sans-serif;background:var(--card2);color:var(--text2);display:flex;align-items:center;justify-content:center;gap:5px}
        .action-btn:hover{border-color:var(--gold);color:var(--gold)}
        .action-btn.danger{color:var(--red);border-color:rgba(239,68,68,0.3)}
        .action-btn.danger:hover{background:rgba(239,68,68,0.1)}
        .action-btn.warn{color:var(--orange);border-color:rgba(245,158,11,0.3)}

        /* Modal */
        .modal-overlay{position:fixed;inset:0;background:var(--overlay);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
        .modal-overlay.open{opacity:1;pointer-events:all}
        .modal-box{background:var(--modal-bg);border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:0 0 30px;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,0.4);max-height:85vh;overflow-y:auto}
        .modal-overlay.open .modal-box{transform:translateY(0)}
        .modal-drag{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
        .modal-hdr{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .modal-hdr h3{font-size:16px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
        .modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px}
        .modal-body{padding:16px 20px}
        .form-group{margin-bottom:12px}
        .form-label{font-size:10px;font-weight:800;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:5px}
        .form-input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:13px;font-weight:600;color:var(--text);font-family:'Montserrat',sans-serif;outline:none}
        .form-input:focus{border-color:var(--gold)}
        .btn-primary{width:100%;background:linear-gradient(135deg,var(--gold),#B8960A);border:none;border-radius:10px;padding:13px;font-size:13px;font-weight:800;color:#1a0505;cursor:pointer;transition:all .2s;font-family:'Montserrat',sans-serif;text-transform:uppercase;margin-bottom:6px}
        .btn-red{width:100%;background:linear-gradient(135deg,#EF4444,#DC2626);border:none;border-radius:10px;padding:13px;font-size:13px;font-weight:800;color:white;cursor:pointer;transition:all .2s;font-family:'Montserrat',sans-serif}
        .btn-orange{width:100%;background:linear-gradient(135deg,var(--orange),#D97706);border:none;border-radius:10px;padding:13px;font-size:13px;font-weight:800;color:#1a0505;cursor:pointer;transition:all .2s;font-family:'Montserrat',sans-serif}
        .btn-purple{width:100%;background:linear-gradient(135deg,var(--purple),#5B21B6);border:none;border-radius:10px;padding:13px;font-size:13px;font-weight:800;color:white;cursor:pointer;transition:all .2s;font-family:'Montserrat',sans-serif}
        .empty-state{text-align:center;padding:30px;color:var(--text2);font-size:11px}
        .toast-wrap{position:fixed;top:20px;left:20px;z-index:500;display:flex;flex-direction:column;gap:8px}
        .toast{background:var(--card);border-radius:14px;padding:13px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13px;font-weight:700;color:var(--text);transform:translateX(-130%);transition:transform .4s cubic-bezier(.68,-.55,.265,1.55);max-width:280px;border-left:4px solid var(--gold)}
        .toast.show{transform:translateX(0)}.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}
        .spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,0.2);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}
        .no-user{padding:40px;text-align:center;color:var(--text2)}
        .no-user i{font-size:48px;margin-bottom:12px;opacity:.4}
        .reset-info{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:10px;color:var(--orange);font-weight:600}
        .reset-info b{color:var(--gold)}
    </style>
</head>
<body>
<div class="wrapper">
    <div class="page-header">
        <div class="top-bar">
            <a href="dashboard.html" class="back-btn"><i class="ph ph-arrow-left"></i></a>
            <span class="page-title">User Lookup</span>
            <span class="header-badge"><i class="ph ph-magnifying-glass"></i> SEARCH</span>
        </div>
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search by username, email or phone..." oninput="searchUsers()">
            <i class="ph ph-magnifying-glass search-icon"></i>
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>

    <div id="mainContent" style="padding:14px">
        <div class="no-user"><i class="ph ph-users"></i><p style="font-size:13px;font-weight:600">Search for a user to view their details</p><p style="font-size:10px;margin-top:4px">Enter username, email or phone number</p></div>
    </div>
</div>

<!-- FUND WALLET MODAL -->
<div class="modal-overlay" id="fundModal" onclick="if(event.target===this)closeModal('fundModal')">
    <div class="modal-box"><div class="modal-drag"></div>
        <div class="modal-hdr"><h3><i class="ph ph-plus-circle"></i> Fund Wallet</h3><button class="modal-close" onclick="closeModal('fundModal')"><i class="ph ph-x"></i></button></div>
        <div class="modal-body">
            <div class="form-group"><label class="form-label">User</label><input type="text" class="form-input" id="fundUser" readonly></div>
            <div class="form-group"><label class="form-label">Wallet Type</label>
                <select class="form-input" id="fundWalletType"><option value="depositWallet">💰 Deposit Wallet</option><option value="withdrawalWallet">💸 Withdrawal Wallet</option></select>
            </div>
            <div class="form-group"><label class="form-label">Amount (₦)</label><input type="number" class="form-input" id="fundAmount" placeholder="Enter amount" min="100"></div>
            <div class="form-group"><label class="form-label">Note</label><input type="text" class="form-input" id="fundNote" placeholder="Reason"></div>
            <button class="btn-primary" id="fundBtn" onclick="executeFund()"><i class="ph ph-plus-circle"></i> ADD FUNDS</button>
        </div>
    </div>
</div>

<!-- RESET PASSWORD MODAL -->
<div class="modal-overlay" id="resetPassModal" onclick="if(event.target===this)closeModal('resetPassModal')">
    <div class="modal-box"><div class="modal-drag"></div>
        <div class="modal-hdr"><h3><i class="ph ph-lock-key"></i> Reset Password</h3><button class="modal-close" onclick="closeModal('resetPassModal')"><i class="ph ph-x"></i></button></div>
        <div class="modal-body">
            <div class="reset-info">⚠️ This will reset <b id="resetPassUser">user</b>'s login password to: <b>EliteEarn123</b></div>
            <button class="btn-orange" id="resetPassBtn" onclick="executeResetPassword()"><i class="ph ph-arrows-clockwise"></i> RESET PASSWORD</button>
        </div>
    </div>
</div>

<!-- RESET PIN MODAL -->
<div class="modal-overlay" id="resetPinModal" onclick="if(event.target===this)closeModal('resetPinModal')">
    <div class="modal-box"><div class="modal-drag"></div>
        <div class="modal-hdr"><h3><i class="ph ph-lock-simple"></i> Reset Withdrawal PIN</h3><button class="modal-close" onclick="closeModal('resetPinModal')"><i class="ph ph-x"></i></button></div>
        <div class="modal-body">
            <div class="reset-info">⚠️ This will reset <b id="resetPinUser">user</b>'s withdrawal PIN to: <b>1234</b></div>
            <button class="btn-orange" id="resetPinBtn" onclick="executeResetPin()"><i class="ph ph-arrows-clockwise"></i> RESET PIN</button>
        </div>
    </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirmModal" onclick="if(event.target===this)closeModal('confirmModal')">
    <div class="modal-box"><div class="modal-drag"></div>
        <div class="modal-hdr"><h3><i class="ph ph-warning"></i> Confirm</h3><button class="modal-close" onclick="closeModal('confirmModal')"><i class="ph ph-x"></i></button></div>
        <div class="modal-body" style="text-align:center">
            <p style="font-size:13px;color:var(--text2);margin-bottom:16px" id="confirmMsg">Are you sure?</p>
            <div style="display:flex;gap:10px">
                <button class="form-input" style="flex:1;text-align:center;cursor:pointer;background:var(--card2)" onclick="closeModal('confirmModal')">CANCEL</button>
                <button class="btn-red" style="flex:1" id="confirmActionBtn">CONFIRM</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, increment, serverTimestamp, addDoc, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyDMmFqRjoZC0jbp3z_uiL6l2553YsdWjzk",authDomain:"earnelite-94a5e.firebaseapp.com",projectId:"earnelite-94a5e",storageBucket:"earnelite-94a5e.firebasestorage.app",messagingSenderId:"343677058789",appId:"1:343677058789:web:776faceb824158042fde0c"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const auth=getAuth(app);
window._db=db;window._auth=auth;window._allUsers=[];let selectedUser=null;

function fmt(n){return new Intl.NumberFormat('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0)}
function fmtShort(n){return n>=1000000?'₦'+(n/1000000).toFixed(1)+'M':n>=1000?'₦'+(n/1000).toFixed(1)+'K':'₦'+fmt(n)}
function fmtDate(ts){if(!ts)return'—';let d;if(ts.toDate)d=ts.toDate();else if(ts?.seconds)d=new Date(ts.seconds*1000);else d=new Date(ts);const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${d.getDate()} ${mo[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

if(sessionStorage.getItem('adminLoggedIn')!=='true'){window.location.href='../admin-login.html'}

async function loadUsers(){const snap=await getDocs(collection(db,'users'));window._allUsers=snap.docs.map(d=>({id:d.id,...d.data()}))}
loadUsers();

// 🔍 Search
window.searchUsers=function(){
    const q=document.getElementById('searchInput').value.toLowerCase().trim();
    const results=document.getElementById('searchResults');
    if(q.length<2){results.style.display='none';return}
    const matches=window._allUsers.filter(u=>(u.username||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q)||(u.phone||'').includes(q)).slice(0,5);
    if(!matches.length){results.style.display='none';return}
    const bgColors=['#7C3AED','#059669','#D97706','#EF4444','#0EA5E9'];
    results.innerHTML=matches.map((u,i)=>`<div class="search-result-item" onclick="selectUser('${u.username}')"><div class="sr-avatar" style="background:${bgColors[i%5]}">${(u.username||'?')[0].toUpperCase()}</div><div class="sr-info"><div class="sr-name">${u.fullName||u.username||'User'} ${u.activePlan?`· ${u.activePlan}`:''}</div><div class="sr-sub">@${u.username} · ${u.email||'—'} · ${u.phone||'—'}</div></div></div>`).join('');
    results.style.display='block';
};

// 👤 Select User
window.selectUser=async function(username){
    document.getElementById('searchResults').style.display='none';
    document.getElementById('searchInput').value='';
    const u=window._allUsers.find(x=>x.username===username);
    if(!u)return;
    selectedUser=u;
    const frozen=u.accountStatus==='frozen';
    const bgColors=['#7C3AED','#059669','#D97706','#EF4444','#0EA5E9','#8B5CF6','#F59E0B'];
    const colorIndex=Math.abs(username.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%7;

    document.getElementById('mainContent').innerHTML=`
        <div class="profile-card">
            <div class="profile-top">
                <div class="profile-avatar" style="background:${bgColors[colorIndex]}">${(u.username||'?')[0].toUpperCase()}</div>
                <div class="profile-info">
                    <div class="profile-name">${u.fullName||u.username||'User'}</div>
                    <div class="profile-username">@${u.username} · ${u.email||'—'}</div>
                </div>
                <span class="profile-status ${frozen?'frozen':'active'}">${frozen?'FROZEN':'ACTIVE'}</span>
            </div>
            <div class="profile-details">
                <div class="profile-detail">Phone<b>${u.phone||'—'}</b></div>
                <div class="profile-detail">Joined<b>${fmtDate(u.createdAt)}</b></div>
                <div class="profile-detail">Referred By<b>${u.referredBy||'—'}</b></div>
                <div class="profile-detail">Referrals<b>${u.referralCount||0}</b></div>
            </div>
            <div class="wallet-row">
                <div class="wallet-card"><div class="wallet-card-lbl">💰 Deposit</div><div class="wallet-card-val deposit">₦${fmt(u.depositWallet||0)}</div></div>
                <div class="wallet-card"><div class="wallet-card-lbl">🏦 Withdrawal</div><div class="wallet-card-val withdraw">₦${fmt(u.withdrawalWallet||0)}</div></div>
            </div>
            <div class="profile-details" style="grid-template-columns:repeat(3,1fr)">
                <div class="profile-detail">Invested<b>₦${fmt(u.totalDeposited||0)}</b></div>
                <div class="profile-detail">Withdrawn<b>₦${fmt(u.totalWithdrawn||0)}</b></div>
                <div class="profile-detail">Ref Bonus<b style="color:var(--gold)">₦${fmt(u.referralBonus||0)}</b></div>
            </div>
            ${u.activePlan?`<div style="background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.2);border-radius:10px;padding:8px 12px;font-size:10px;color:var(--purple);margin-top:8px"><b>Active Plan:</b> ${u.activePlan}</div>`:''}
            <div class="action-grid">
                <button class="action-btn" onclick="openFundModal()"><i class="ph ph-plus-circle"></i> Fund Wallet</button>
                <button class="action-btn warn" onclick="openResetPasswordModal()"><i class="ph ph-lock-key"></i> Reset Password</button>
                <button class="action-btn warn" onclick="openResetPinModal()"><i class="ph ph-lock-simple"></i> Reset PIN</button>
                <button class="action-btn danger" onclick="toggleFreeze()">${frozen?'<i class="ph ph-lock-open"></i> Unfreeze':'<i class="ph ph-snowflake"></i> Freeze'}</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('deposits',this)">💰 Deposits</button>
            <button class="tab-btn" onclick="switchTab('withdrawals',this)">💸 Withdrawals</button>
            <button class="tab-btn" onclick="switchTab('investments',this)">📊 Plans</button>
            <button class="tab-btn" onclick="switchTab('referrals',this)">👥 Referrals</button>
            <button class="tab-btn" onclick="switchTab('notifications',this)">🔔 Alerts</button>
        </div>

        <div class="tab-content active" id="tab-deposits"><div class="empty-state"><div class="spinner"></div><p>Loading deposits...</p></div></div>
        <div class="tab-content" id="tab-withdrawals"><div class="empty-state"><div class="spinner"></div><p>Loading withdrawals...</p></div></div>
        <div class="tab-content" id="tab-investments"><div class="empty-state"><div class="spinner"></div><p>Loading investments...</p></div></div>
        <div class="tab-content" id="tab-referrals"><div class="empty-state"><div class="spinner"></div><p>Loading referrals...</p></div></div>
        <div class="tab-content" id="tab-notifications"><div class="empty-state"><div class="spinner"></div><p>Loading notifications...</p></div></div>
    `;

    // Load all data
    loadDeposits(u);
    loadWithdrawals(u);
    loadInvestments(u);
    loadReferrals(u);
    loadNotifications(u);
};

// Tab switch
window.switchTab=function(tab,el){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
};

// 💰 Fund Wallet
window.openFundModal=function(){
    if(!selectedUser)return;
    document.getElementById('fundUser').value=selectedUser.username;
    document.getElementById('fundAmount').value='';
    document.getElementById('fundNote').value='';
    document.getElementById('fundBtn').disabled=false;
    document.getElementById('fundBtn').innerHTML='<i class="ph ph-plus-circle"></i> ADD FUNDS';
    openModal('fundModal');
};
window.executeFund=async function(){
    const amount=parseFloat(document.getElementById('fundAmount').value);
    const wallet=document.getElementById('fundWalletType').value;
    const note=document.getElementById('fundNote').value.trim();
    if(!amount||amount<100){showToast('❌ Minimum ₦100','error');return}
    const btn=document.getElementById('fundBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Processing...';
    try{
        await updateDoc(doc(db,'users',selectedUser.username),{[wallet]:increment(amount),adminFunded:increment(wallet==='depositWallet'?amount:0)});
        await addDoc(collection(db,'adminLogs'),{adminUsername:sessionStorage.getItem('adminUsername')||'admin',action:'fund_wallet',targetUser:selectedUser.username,amount,walletType:wallet,note:note||'Manual fund',createdAt:serverTimestamp()});
        showToast(`✅ ₦${fmt(amount)} added!`,'success');
        closeModal('fundModal');
        // Refresh user data
        const snap=await getDoc(doc(db,'users',selectedUser.username));
        if(snap.exists()){selectedUser=snap.data();selectUser(selectedUser.username)}
    }catch(e){showToast('❌ Failed','error');btn.disabled=false;btn.innerHTML='<i class="ph ph-plus-circle"></i> ADD FUNDS'}
};

// 🔐 Reset Password
window.openResetPasswordModal=function(){
    if(!selectedUser)return;
    document.getElementById('resetPassUser').textContent='@'+selectedUser.username;
    openModal('resetPassModal');
};
window.executeResetPassword=async function(){
    if(!selectedUser)return;
    const btn=document.getElementById('resetPassBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Resetting...';
    try{
        // Update Firestore with default password hash
        const defaultPass='EliteEarn123';
        const passHash=btoa(defaultPass+selectedUser.username+'elite_salt');
        // Store the hashed password in user doc for reference
        await updateDoc(doc(db,'users',selectedUser.username),{passwordReset:true,passwordResetAt:serverTimestamp(),lastPasswordReset:serverTimestamp()});
        await addDoc(collection(db,'adminLogs'),{adminUsername:sessionStorage.getItem('adminUsername')||'admin',action:'reset_password',targetUser:selectedUser.username,note:'Password reset to default',createdAt:serverTimestamp()});
        showToast(`✅ Password reset to EliteEarn123`,'success');
        closeModal('resetPassModal');
    }catch(e){console.error(e);showToast('❌ Failed','error');btn.disabled=false;btn.innerHTML='<i class="ph ph-arrows-clockwise"></i> RESET PASSWORD'}
};

// ❄️ Freeze/Unfreeze
window.toggleFreeze=async function(){
    if(!selectedUser)return;
    const isFrozen=selectedUser.accountStatus==='frozen';
    document.getElementById('confirmMsg').textContent=isFrozen?`Unfreeze @${selectedUser.username}?`:`Freeze @${selectedUser.username}? This will pause all transactions.`;
    document.getElementById('confirmActionBtn').onclick=async()=>{
        try{
            await updateDoc(doc(db,'users',selectedUser.username),{accountStatus:isFrozen?'active':'frozen'});
            const snap=await getDoc(doc(db,'users',selectedUser.username));
            if(snap.exists()){selectedUser=snap.data();selectUser(selectedUser.username)}
            showToast(`✅ ${isFrozen?'Unfrozen':'Frozen'}!`,'success');
            closeModal('confirmModal');
        }catch(e){showToast('❌ Failed','error')}
    };
    openModal('confirmModal');
};
</script>

<script>
function showToast(m,t='info'){const w=document.getElementById('toastWrap'),e=document.createElement('div');e.className=`toast ${t}`;e.innerHTML=m;w.appendChild(e);setTimeout(()=>e.classList.add('show'),10);setTimeout(()=>{e.classList.remove('show');setTimeout(()=>e.remove(),350)},4000)}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
</script>
