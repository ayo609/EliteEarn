<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>EliteEarn – Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        /* ALL YOUR EXISTING CSS - KEEP IT EXACTLY AS IS */
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        :root{
            --bg:#f2f0ec;--card:#ffffff;--card2:#faf8f5;--text:#0f0a00;--text2:#7a6a55;
            --border:#e8e0d4;--gold:#B8960A;--gold2:#D4A800;--gold3:#F0C000;
            --gold-bg:#FFF8E0;--red:#7a1010;--red2:#9a1818;
            --header:linear-gradient(150deg,#1a0505 0%,#5a0e0e 40%,#8b1a1a 70%,#a52020 100%);
            --nav-bg:#ffffff;--action-bg:#ffffff;--marquee-bg:#ffffff;
            --overlay:rgba(0,0,0,0.65);--modal-bg:#ffffff;--notif-bg:#ffffff;
            --input-bg:#f5f0e8;--timeline-bg:#ffffff;--tag-bg:#f5f0e8;
            --tag-border:#e8e0d4;--tag-text:#5a4a35;
        }
        [data-theme="dark"]{
            --bg:#0c0c18;--card:#181830;--card2:#20203a;--text:#f0f0ff;--text2:#8888aa;
            --border:#2a2a44;--gold-bg:rgba(184,150,10,.1);--nav-bg:#181830;
            --action-bg:#181830;--marquee-bg:#181830;--modal-bg:#181830;
            --notif-bg:#181830;--input-bg:#20203a;--timeline-bg:#181830;
            --tag-bg:#20203a;--tag-border:#2a2a44;--tag-text:#aaaacc;
        }
        html,body{font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text);transition:background .3s,color .3s;}
        body{display:flex;flex-direction:column;min-height:100vh;}
        .wrapper{width:100%;max-width:480px;margin:0 auto;flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow-x:hidden;min-height:100vh;padding-bottom:100px;transition:background .3s;}
        .top-header{background:var(--header);padding:18px 20px 24px;position:relative;z-index:10;overflow:hidden;}
        .top-header::before{content:'';position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(196,154,0,.18) 0%,transparent 70%);top:-100px;right:-60px;pointer-events:none;}
        .top-header-bar{display:flex;justify-content:space-between;align-items:center;}
        .logo-area{display:flex;align-items:center;gap:10px;}
        .logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:21px;font-weight:900;box-shadow:0 4px 14px rgba(245,158,11,.4);font-family:'Oswald',sans-serif;}
        .logo-text{font-family:'Oswald',sans-serif;font-size:21px;font-weight:700;color:white;letter-spacing:.5px;}
        .header-actions{display:flex;align-items:center;gap:12px;}
        .hdr-btn{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:white;font-size:19px;cursor:pointer;transition:all .2s;backdrop-filter:blur(10px);position:relative;}
        .hdr-btn:hover{background:rgba(255,255,255,.3);transform:scale(1.08);}
        .notif-dot{position:absolute;top:5px;right:5px;width:9px;height:9px;background:#EF4444;border-radius:50%;border:2px solid transparent;display:none;}
        .notif-dot.active{display:block;animation:blink 1.5s infinite;}
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
        .welcome-row{display:flex;align-items:center;justify-content:space-between;margin-top:18px;}
        .welcome-text{color:rgba(255,255,255,.75);font-size:12px;font-weight:600;margin-bottom:2px;}
        .welcome-name{color:white;font-size:20px;font-weight:900;font-family:'Oswald',sans-serif;letter-spacing:.5px;}
        .online-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(5,150,105,.25);border:1px solid rgba(5,150,105,.4);border-radius:50px;padding:5px 12px;font-size:11px;font-weight:700;color:#6EE7B7;}
        .online-dot{width:7px;height:7px;background:#10B981;border-radius:50%;animation:pulse-dot 1.5s infinite;}
        @keyframes pulse-dot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:.6;}}
        .hero-card{margin:0 16px;margin-top:-10px;background:linear-gradient(135deg,#1e0505 0%,#3a0a0a 40%,#4a1010 70%,#5a1818 100%);border-radius:26px;padding:24px 22px;position:relative;z-index:5;box-shadow:0 16px 48px rgba(0,0,0,.3);overflow:hidden;}
        .hero-card::before{content:'';position:absolute;right:-30px;top:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(184,150,10,.15) 0%,transparent 70%);border-radius:50%;}
        .hero-card::after{content:'';position:absolute;left:-20px;bottom:-20px;width:120px;height:120px;background:radial-gradient(circle,rgba(255,255,255,.04) 0%,transparent 70%);border-radius:50%;}
        .hero-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;position:relative;z-index:1;}
        .hero-balance{font-size:42px;font-weight:900;color:white;font-family:'Oswald',sans-serif;letter-spacing:-1px;line-height:1;position:relative;z-index:1;margin-bottom:6px;}
        .hero-balance span{font-size:18px;color:var(--gold3);margin-right:4px;}
        .hero-sub{font-size:12px;font-weight:600;color:rgba(255,255,255,.5);position:relative;z-index:1;margin-bottom:18px;}
        .hero-wallets{display:flex;gap:10px;position:relative;z-index:1;}
        .hero-wallet-pill{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;backdrop-filter:blur(10px);}
        .hw-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
        .hw-val{font-size:15px;font-weight:900;font-family:'Oswald',sans-serif;}
        .hw-val.gold{color:var(--gold3);}.hw-val.green{color:#6EE7B7;}.hw-val.purple{color:#C4B5FD;}
        .marquee-bar{background:var(--marquee-bg);margin:14px 16px 0;border-radius:50px;padding:12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px rgba(0,0,0,.06);overflow:hidden;border:1px solid var(--border);transition:background .3s;}
        .marquee-icon{color:var(--gold);font-size:18px;flex-shrink:0;}
        .marquee-track{overflow:hidden;flex:1;}
        .marquee-text{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;display:inline-block;animation:marquee 20s linear infinite;}
        @keyframes marquee{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
        .action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 16px 0;}
        .action-btn{background:var(--action-bg);border-radius:20px;padding:16px 6px;text-align:center;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);border:1.5px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.05);text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;}
        .action-btn:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.12);border-color:var(--gold);}
        .action-btn:active{transform:scale(.95);}
        .action-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;}
        .action-icon.red{background:rgba(138,16,16,.1);color:#c0392b;}
        .action-icon.gold{background:rgba(184,150,10,.1);color:var(--gold);}
        .action-icon.green{background:rgba(5,150,105,.1);color:#059669;}
        .action-icon.blue{background:rgba(37,99,235,.1);color:#2563EB;}
        .action-label{font-size:9px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;line-height:1.3;}
        .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 16px 0;}
        .stat-card{background:var(--card);border-radius:20px;padding:16px 12px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.06);border:1px solid var(--border);transition:all .3s;}
        .stat-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.1);}
        .stat-icon-wrap{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:20px;}
        .stat-icon-wrap.gold{background:rgba(184,150,10,.1);color:var(--gold);}
        .stat-icon-wrap.green{background:rgba(5,150,105,.1);color:#059669;}
        .stat-icon-wrap.purple{background:rgba(124,58,237,.1);color:#7C3AED;}
        .stat-label{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
        .stat-val{font-size:16px;font-weight:900;color:var(--text);font-family:'Oswald',sans-serif;}
        .active-plan-card{margin:14px 16px 0;background:linear-gradient(135deg,#B8960A,#D4A800);border-radius:22px;padding:18px 20px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(184,150,10,.3);}
        .active-plan-card::before{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%;}
        .ap-label{font-size:10px;font-weight:800;color:rgba(255,255,255,.7);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
        .ap-name{font-size:18px;font-weight:900;color:white;font-family:'Oswald',sans-serif;margin-bottom:10px;}
        .ap-stats{display:flex;gap:12px;}
        .ap-stat{background:rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;flex:1;text-align:center;}
        .ap-stat-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
        .ap-stat-val{font-size:14px;font-weight:900;color:white;font-family:'Oswald',sans-serif;}
        .ap-no-plan{font-size:13px;font-weight:600;color:rgba(255,255,255,.8);}
        .ap-cta{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:50px;padding:8px 16px;margin-top:12px;font-size:12px;font-weight:800;color:white;text-decoration:none;cursor:pointer;transition:all .2s;}
        .ap-cta:hover{background:rgba(255,255,255,.3);}
        .section-hdr{display:flex;align-items:center;justify-content:space-between;margin:20px 16px 12px;}
        .section-hdr-left{display:flex;align-items:center;gap:8px;}
        .section-hdr-left i{font-size:20px;color:var(--gold);}
        .section-hdr h3{font-size:17px;font-weight:800;color:var(--text);}
        .section-hdr-link{font-size:12px;font-weight:700;color:var(--gold);text-decoration:none;}
        .operations-card{margin:0 16px;background:var(--timeline-bg);border-radius:24px;padding:24px 20px;box-shadow:0 4px 16px rgba(0,0,0,.07);border:1px solid var(--border);transition:background .3s;}
        .timeline{position:relative;padding-left:26px;}
        .timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(to bottom,var(--gold),var(--gold2),#7C3AED);border-radius:2px;}
        .tl-item{position:relative;margin-bottom:22px;}
        .tl-item:last-child{margin-bottom:0;}
        .tl-dot{position:absolute;left:-26px;top:2px;width:16px;height:16px;background:var(--timeline-bg);border:3px solid var(--gold);border-radius:50%;z-index:2;transition:background .3s;}
        .tl-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
        .tl-title i{font-size:17px;color:var(--gold);}
        .tl-tags{display:flex;flex-wrap:wrap;gap:7px;}
        .tl-tag{background:var(--tag-bg);border:1px solid var(--tag-border);border-radius:50px;padding:6px 12px;font-size:11px;font-weight:700;color:var(--tag-text);display:flex;align-items:center;gap:5px;transition:background .3s,border-color .3s;}
        .tl-tag i{color:#059669;font-size:11px;}
        .testimonials-wrap{margin:0 16px;}
        .testimonial-slide{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.06);border:1px solid var(--border);transition:background .3s;}
        .testimonial-text{font-size:13px;line-height:1.7;color:var(--text2);margin-bottom:14px;font-style:italic;}
        .testimonial-author{display:flex;align-items:center;gap:10px;}
        .testimonial-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--red2),var(--gold));display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:13px;flex-shrink:0;}
        .testimonial-name{font-size:13px;font-weight:800;color:var(--text);}
        .testimonial-stars{color:var(--gold);font-size:12px;margin-top:2px;}
        .swiper-pagination-bullet-active{background:var(--gold)!important;}
        .float-gift{position:fixed;bottom:100px;left:20px;width:52px;height:52px;background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(245,158,11,.4);z-index:50;animation:bounce 2s infinite;border:3px solid white;}
        @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
        .float-gift .badge{position:absolute;top:-4px;right:-4px;background:#EF4444;color:white;font-size:10px;font-weight:800;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;}
        .float-support{position:fixed;bottom:100px;right:20px;width:52px;height:52px;background:var(--card);border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.1);z-index:50;transition:all .3s;}
        .float-support:hover{background:var(--gold-bg);transform:scale(1.1);}
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--nav-bg);border-radius:28px 28px 0 0;padding:10px 20px 24px;display:flex;justify-content:space-around;align-items:flex-end;box-shadow:0 -8px 30px rgba(0,0,0,.1);z-index:100;transition:background .3s;}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all .2s;padding:4px 8px;border-radius:12px;text-decoration:none;color:inherit;}
        .nav-item i{font-size:22px;color:#9ca3af;transition:all .2s;}
        .nav-item span{font-size:10px;font-weight:700;color:#9ca3af;transition:all .2s;}
        .nav-item.active i,.nav-item:hover i{color:#7C3AED;}
        .nav-item.active span,.nav-item:hover span{color:#7C3AED;}
        .nav-center{position:relative;top:-28px;}
        .nav-center-btn{width:60px;height:60px;background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:26px;box-shadow:0 6px 20px rgba(245,158,11,.4);border:4px solid var(--nav-bg);cursor:pointer;transition:all .3s;}
        .nav-center-btn:hover{transform:scale(1.1);box-shadow:0 8px 25px rgba(245,158,11,.5);}
        .notif-overlay{position:fixed;inset:0;background:var(--overlay);z-index:200;display:none;opacity:0;transition:opacity .3s;}
        .notif-overlay.open{display:block;opacity:1;}
        .notif-panel{position:fixed;top:0;right:-100%;width:min(340px,92vw);height:100vh;background:var(--notif-bg);z-index:201;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2);transition:right .35s cubic-bezier(.4,0,.2,1);}
        .notif-panel.open{right:0;}
        .n-hdr{background:linear-gradient(135deg,var(--red2),#5a0e0e);padding:24px 20px 20px;display:flex;align-items:center;justify-content:space-between;}
        .n-hdr h3{color:white;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;}
        .n-close{background:rgba(255,255,255,.2);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;cursor:pointer;}
        .n-bar{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
        .n-count{font-size:12px;font-weight:700;color:var(--text2);}
        .n-markall{background:none;border:none;font-size:12px;font-weight:700;color:var(--gold);cursor:pointer;font-family:'Montserrat',sans-serif;}
        .n-list{flex:1;overflow-y:auto;padding:8px 0;}
        .n-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s;position:relative;}
        .n-item.unread{background:rgba(184,150,10,.04);}
        .n-item.unread::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);border-radius:0 2px 2px 0;}
        .n-icon{width:42px;height:42px;min-width:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;}
        .n-icon.deposit{background:rgba(5,150,105,.1);color:#059669;}
        .n-icon.gift{background:rgba(245,158,11,.1);color:#D97706;}
        .n-icon.system{background:rgba(124,58,237,.1);color:#7C3AED;}
        .n-icon.plan{background:rgba(184,150,10,.1);color:var(--gold);}
        .n-icon.warning{background:rgba(239,68,68,.1);color:#EF4444;}
        .n-body{flex:1;min-width:0;}
        .n-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;}
        .n-msg{font-size:12px;color:var(--text2);line-height:1.5;}
        .n-time{font-size:10px;color:var(--text2);margin-top:4px;font-weight:600;}
        .n-dot{width:8px;height:8px;min-width:8px;background:var(--gold);border-radius:50%;margin-top:6px;}
        .n-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text2);text-align:center;}
        .n-empty i{font-size:48px;margin-bottom:12px;opacity:.4;}
        .n-empty p{font-size:13px;font-weight:600;}
        .gift-overlay{position:fixed;inset:0;background:var(--overlay);z-index:250;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s;}
        .gift-overlay.open{opacity:1;pointer-events:all;}
        .gift-modal{background:var(--modal-bg);border-radius:32px 32px 0 0;width:100%;max-width:480px;padding:0 0 40px;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);box-shadow:0 -12px 50px rgba(0,0,0,.25);}
        .gift-overlay.open .gift-modal{transform:translateY(0);}
        .drag-h{width:48px;height:5px;background:var(--border);border-radius:3px;margin:16px auto 0;}
        .g-hdr{background:linear-gradient(135deg,#F59E0B,#D97706);margin:20px 24px 0;border-radius:24px;padding:28px 24px;text-align:center;position:relative;overflow:hidden;}
        .g-hdr::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,transparent 1px,transparent 12px);}
        .g-big-icon{width:70px;height:70px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:34px;color:white;border:3px solid rgba(255,255,255,.4);animation:gpulse 2s infinite;}
        @keyframes gpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.3);}50%{box-shadow:0 0 0 12px rgba(255,255,255,0);}}
        .g-hdr h2{font-size:21px;font-weight:800;color:white;margin-bottom:5px;}
        .g-hdr p{font-size:12px;color:rgba(255,255,255,.85);font-weight:600;}
        .g-body{padding:24px 24px 0;}
        .g-lbl{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
        .g-inp-wrap{display:flex;align-items:center;background:var(--input-bg);border:2px solid var(--border);border-radius:16px;padding:6px 6px 6px 18px;gap:10px;transition:all .3s;margin-bottom:18px;}
        .g-inp-wrap:focus-within{border-color:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.12);}
        .g-inp-wrap i{font-size:20px;color:#D97706;}
        .g-inp{flex:1;border:none;background:transparent;font-size:18px;font-weight:700;color:var(--text);outline:none;padding:10px 0;font-family:'Montserrat',sans-serif;letter-spacing:3px;text-transform:uppercase;}
        .g-inp::placeholder{color:var(--text2);font-size:13px;letter-spacing:2px;font-weight:600;}

        .toast-wrap{position:fixed;top:20px;left:20px;z-index:400;display:flex;flex-direction:column;gap:8px;}

<!-- FIREBASE - FIXED VERSION -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
    apiKey:"AIzaSyDMmFqRjoZC0jbp3z_uiL6l2553YsdWjzk",
    authDomain:"earnelite-94a5e.firebaseapp.com",
    projectId:"earnelite-94a5e",
    storageBucket:"earnelite-94a5e.firebasestorage.app",
    messagingSenderId:"343677058789",
    appId:"1:343677058789:web:776faceb824158042fde0c"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUid='', currentUsername='';
let dataRefreshInterval = null;
let authChecked = false; // 🔑 KEY FIX: Track if auth has been checked

function fmt(n){return new Intl.NumberFormat('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);}
function fmtShort(n){n=n||0;if(n>=1000000)return'₦'+(n/1000000).toFixed(1)+'M';if(n>=1000)return'₦'+(n/1000).toFixed(1)+'K';return'₦'+fmt(n);}

// 🔑 KEY FIX: Load from session FIRST before any auth check
function loadFromSession() {
    const sessionData = sessionStorage.getItem('userData');
    const userLoggedIn = sessionStorage.getItem('userLoggedIn');
    
    if (userLoggedIn === 'true' && sessionData) {
        try {
            const data = JSON.parse(sessionData);
            document.getElementById('welcomeName').textContent = data.username || 'Investor';
            document.getElementById('totalPortfolio').textContent = fmt(data.balance || 0);
            document.getElementById('depositWalletHero').textContent = fmt(data.depositWallet || 0);
            document.getElementById('withdrawWalletHero').textContent = fmt(data.withdrawalWallet || 0);
            document.getElementById('teamSize').textContent = data.referralCount || 0;
            document.getElementById('totalEarned').textContent = fmtShort(data.depositWallet || 0);
            document.getElementById('refBonus').textContent = fmtShort(0);
            currentUsername = data.username;
            console.log('✅ Loaded from session:', data.username);
            return true;
        } catch(e) {
            console.log('Session parse error');
        }
    }
    return false;
}

async function loadUserData(uid){
    try{
        const uidSnap=await getDoc(doc(db,'usersByUid',uid));
        if(!uidSnap.exists()){
            console.log('❌ User doc not found');
            return;
        }
        currentUsername=uidSnap.data().username||'';

        const userSnap=await getDoc(doc(db,'users',currentUsername));
        const data=userSnap.exists()?userSnap.data():{};
        window._userData=data;
        window._currentUsername=currentUsername;

        // Save to session storage
        sessionStorage.setItem('userLoggedIn', 'true');
        sessionStorage.setItem('userEmail', data.email || '');
        sessionStorage.setItem('userUid', uid);
        sessionStorage.setItem('username', currentUsername);
        sessionStorage.setItem('userData', JSON.stringify({
            username: currentUsername,
            email: data.email || '',
            balance: data.balance || 0,
            depositWallet: data.depositWallet || 0,
            withdrawalWallet: data.withdrawalWallet || 0,
            referralCount: data.referralCount || 0,
            isAdmin: data.isAdmin || false
        }));

        // Update UI
        document.getElementById('welcomeName').textContent=(data.fullName||currentUsername||'Investor').split(' ')[0];
        const dep=data.depositWallet||0;
        const wit=data.withdrawalWallet||0;
        const inv=data.totalDeposited||0;
        document.getElementById('totalPortfolio').textContent=fmt(dep+wit);
        document.getElementById('depositWalletHero').textContent=fmt(dep);
        document.getElementById('withdrawWalletHero').textContent=fmt(wit);
        document.getElementById('totalInvestedHero').textContent=fmt(inv);
        
        const refBonus=data.referralBonus||0;
        const teamSize=data.referralCount||0;
        document.getElementById('totalEarned').textContent=fmtShort((data.totalWithdrawn||0)+wit);
        document.getElementById('teamSize').textContent=teamSize;
        document.getElementById('refBonus').textContent=fmtShort(refBonus);

        if(data.activePlan&&data.activeInvestmentId){
            document.getElementById('activeplanSub').innerHTML=`Active: <strong style="color:var(--gold3);">${data.activePlan}</strong>`;
            document.getElementById('activePlanName').textContent=data.activePlan;
            document.getElementById('apCta').style.display='none';
            try{
                const investSnap=await getDoc(doc(db,'investments',data.activeInvestmentId));
                if(investSnap.exists()){
                    const iData=investSnap.data();
                    document.getElementById('apDailyProfit').textContent='₦'+fmt(iData.dailyProfit||0);
                    document.getElementById('apTotal').textContent='₦'+fmt(iData.totalExpected||0);
                    if(iData.endDate){
                        const end=iData.endDate.toDate?iData.endDate.toDate():new Date(iData.endDate.seconds*1000);
                        document.getElementById('apDaysLeft').textContent=Math.max(0,Math.ceil((end-new Date())/86400000))+' days';
                    }
                    document.getElementById('activePlanStats').style.display='flex';
                }
            }catch(e){}
        }

        window._walletBalance=dep;
        await loadNotifications(uid);
        console.log('✅ Dashboard data loaded');
    }catch(e){
        console.error('Error loading dashboard:', e);
    }
}

async function loadNotifications(uid){
    try{
        const q=query(collection(db,'notifications'),where('uid','==',uid));
        const snap=await getDocs(q);
        const items=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.timestamp?.seconds||0)-(a.timestamp?.seconds||0));
        window._renderNotifs(items.length?items:null);
    }catch(e){window._renderNotifs(null);}
}

window.firebaseClaimGift=async function(code){
    try{
        const cr=doc(db,'giftCodes',code.toUpperCase());
        const snap=await getDoc(cr);
        if(!snap.exists()) return{success:false,msg:'Invalid gift code.'};
        const data=snap.data();
        if(!data.active) return{success:false,msg:'Code has expired or been used.'};
        if(data.claimedBy&&data.claimedBy.includes(currentUsername)) return{success:false,msg:'You have already claimed this code.'};
        const amount=data.amount||0;
        await updateDoc(doc(db,'users',currentUsername),{depositWallet:increment(amount)});
        await updateDoc(cr,{claimedBy:[...(data.claimedBy||[]),currentUsername],active:data.singleUse?false:data.active});
        await addDoc(collection(db,'notifications'),{uid:currentUid,type:'gift',title:'Gift Claimed! 🎁',msg:`₦${amount.toLocaleString()} added to your wallet.`,timestamp:serverTimestamp(),read:false});
        window._walletBalance=(window._walletBalance||0)+amount;
        document.getElementById('depositWalletHero').textContent=fmt(window._walletBalance);
        return{success:true,amount};
    }catch(e){return{success:false,msg:'Something went wrong.'};}
};

window.handleLogout = async function() {
    try {
        await signOut(auth);
        sessionStorage.clear();
        localStorage.removeItem('eliteEarn_rememberedEmail');
        window.location.href = 'login.html';
    } catch(e) {}
};

// 🔑 KEY FIX: Load session IMMEDIATELY before auth check
const hasSession = loadFromSession();

// 🔑 KEY FIX: Auth state listener - ONLY redirect if NO session AND no user
onAuthStateChanged(auth, async (user) => {
    authChecked = true;
    
    if (!user) {
        // Only redirect if there's no session data at all
        if (!hasSession && !sessionStorage.getItem('userLoggedIn')) {
            console.log('❌ No auth and no session, redirecting');
            sessionStorage.clear();
            window.location.href = 'login.html';
            return;
        }
        // Has session data, stay on dashboard
        console.log('⚠️ No Firebase auth but session exists, staying on dashboard');
        return;
    }
    
    currentUid = user.uid;
    window._currentUid = currentUid;
    console.log('✅ Authenticated:', user.email);
    
    // Full data load
    await loadUserData(user.uid);
    
    // Auto-refresh
    if (dataRefreshInterval) clearInterval(dataRefreshInterval);
    dataRefreshInterval = setInterval(() => {
        if (currentUid) loadUserData(currentUid);
    }, 30000);
});

// 🔑 KEY FIX: Fallback - if auth doesn't respond in 3 seconds but we have session, keep dashboard
setTimeout(() => {
    if (!authChecked && hasSession) {
        console.log('⚠️ Auth check timeout - keeping dashboard with session data');
    }
}, 3000);
</script>
