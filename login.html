<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>EliteEarn – Sign In</title>

    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#7C3AED">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;background-color:#f9fafb;color:#1f2937}
        body{display:flex;flex-direction:column;min-height:100vh;position:relative}
        .app-mobile-wrapper{width:100%;max-width:480px;margin:0 auto;flex:1;display:flex;flex-direction:column;background:linear-gradient(135deg,#7C3AED 0%,#6D28D9 40%,#5B21B6 70%,#4C1D95 100%);position:relative;box-shadow:0 20px 50px rgba(0,0,0,0.15);overflow:hidden}
        .ambient-glow{position:absolute;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none;animation:pulse 4s ease-in-out infinite}
        @keyframes pulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:0.9;transform:scale(1.1)}}
        .glow-top-right{width:280px;height:280px;background:rgba(245,158,11,0.35);top:-60px;right:-60px}
        .glow-bottom-left{width:320px;height:320px;background:rgba(139,92,246,0.4);top:15%;left:-120px}
        .glow-center{width:200px;height:200px;background:rgba(255,255,255,0.08);top:40%;left:50%;transform:translateX(-50%)}
        .particle{position:absolute;border-radius:50%;background:rgba(255,255,255,0.15);pointer-events:none;z-index:1}
        .p1{width:8px;height:8px;top:20%;left:15%;animation:float 6s ease-in-out infinite}
        .p2{width:12px;height:12px;top:35%;right:20%;animation:float 8s ease-in-out infinite 1s}
        .p3{width:6px;height:6px;top:50%;left:25%;animation:float 7s ease-in-out infinite 2s}
        .p4{width:10px;height:10px;top:25%;right:30%;animation:float 5s ease-in-out infinite 0.5s}
        @keyframes float{0%,100%{transform:translateY(0) translateX(0);opacity:0.3}25%{transform:translateY(-20px) translateX(10px);opacity:0.8}50%{transform:translateY(-10px) translateX(-10px);opacity:0.5}75%{transform:translateY(-30px) translateX(5px);opacity:0.7}}
        .app-header-area{padding:50px 28px 80px;color:#ffffff;position:relative;z-index:1}
        .header-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:50px;padding:6px 14px;font-size:10px;font-weight:700;color:#FCD34D;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;backdrop-filter:blur(10px)}
        .header-badge::before{content:'✦';font-size:9px}
        .app-header-area h1{font-size:36px;font-weight:800;margin:0 0 6px 0;line-height:1.1;letter-spacing:-1px;text-shadow:0 4px 20px rgba(0,0,0,0.2)}
        .app-header-area p{margin:0;font-size:13px;font-weight:500;opacity:0.85}
        .app-content-card{flex:1;background:linear-gradient(to bottom,#ffffff 0%,#fafafa 100%);border-radius:36px 36px 0 0;padding:28px 22px 24px;margin-top:-50px;position:relative;z-index:2;display:flex;flex-direction:column;box-shadow:0 -15px 40px rgba(0,0,0,0.12)}
        .card-header-row{margin-bottom:20px}
        .card-header-row h2{color:#D97706;font-size:28px;font-weight:800;margin:0;background:linear-gradient(135deg,#F59E0B 0%,#D97706 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .pill-input-group{position:relative;margin-bottom:14px}
        .pill-input-group input{width:100%;height:50px;padding:0 42px 0 46px;background:#ffffff;border:1.5px solid rgba(0,0,0,0.06);border-radius:25px;font-size:13px;font-weight:600;color:#1f2937;outline:none;box-shadow:0 2px 6px rgba(0,0,0,0.03);transition:all 0.3s}
        .pill-input-group input:focus{border-color:transparent;box-shadow:0 0 0 2.5px rgba(139,92,246,0.2),0 6px 16px rgba(139,92,246,0.1);transform:translateY(-2px)}
        .pill-input-group i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:1.2rem;pointer-events:none}
        .eye-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#9ca3af;background:none;border:none;padding:6px;font-size:1.1rem;z-index:10}
        .field-hint{font-size:10px;margin:3px 0 0 16px;display:none;font-weight:600}
        .field-hint.error{color:#EF4444;display:block}.field-hint.success{color:#10B981;display:block}
        .remember-row{display:flex;align-items:center;margin:0 0 12px 4px;gap:6px}
        .remember-row input{width:16px;height:16px;accent-color:#8B5CF6;cursor:pointer}
        .remember-row label{font-size:11px;color:#6b7280;font-weight:600;cursor:pointer}
        .forgot-row{display:flex;justify-content:flex-end;margin:-6px 4px 12px 0}
        .forgot-row a{font-size:11px;color:#8B5CF6;font-weight:700;text-decoration:none}
        .btn-pill-primary{width:100%;height:50px;background:linear-gradient(135deg,#F59E0B 0%,#D97706 50%,#B45309 100%);color:#fff;border:none;border-radius:25px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 6px 20px rgba(245,158,11,0.3);transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn-pill-primary:hover:not(:disabled){transform:translateY(-2px)}
        .btn-pill-primary:disabled{opacity:.6;cursor:not-allowed}
        .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}
        .signup-row{margin-top:auto;text-align:center;padding-top:20px}
        .signup-row p{font-size:12px;color:#6b7280;font-weight:600;margin:0}
        .signup-row a{color:#D97706;font-weight:800;text-decoration:none;margin-left:3px}
        #elite-toast-container{position:fixed;top:16px;left:16px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
        .elite-toast{max-width:300px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.15);display:flex;align-items:flex-start;padding:12px;pointer-events:auto;transform:translateX(-120%);opacity:0;transition:all .4s cubic-bezier(.68,-.55,.265,1.55)}
        .elite-toast.show{transform:translateX(0);opacity:1}
        .elite-toast-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-right:10px;flex-shrink:0}
        .elite-toast-body{flex:1}
        .elite-toast-title{font-size:13px;font-weight:800;color:#1f2937;margin-bottom:2px}
        .elite-toast-message{font-size:11px;color:#6b7280}
        .elite-toast-close{background:none;border:none;color:#9ca3af;font-size:13px;cursor:pointer;padding:2px}
    </style>
</head>
<body>
    <main style="flex:1;display:flex;flex-direction:column;width:100%;">
        <div class="app-mobile-wrapper">
            <div class="ambient-glow glow-top-right"></div><div class="ambient-glow glow-bottom-left"></div><div class="ambient-glow glow-center"></div>
            <div class="particle p1"></div><div class="particle p2"></div><div class="particle p3"></div><div class="particle p4"></div>

            <div class="app-header-area">
                <div class="header-badge">Invest & Earn</div>
                <h1>Welcome<br>Back!</h1>
                <p>Sign in to EliteEarn</p>
            </div>

            <div class="app-content-card">
                <div class="card-header-row"><h2>Sign In</h2></div>
                <form id="loginForm" autocomplete="off" onsubmit="return false;">
                    <div class="pill-input-group">
                        <input type="email" id="loginEmail" placeholder="Email Address" required autocomplete="email">
                        <i class="ph ph-envelope-simple"></i>
                        <div class="field-hint" id="emailHint"></div>
                    </div>
                    <div class="pill-input-group">
                        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
                        <i class="ph ph-lock-key"></i>
                        <button type="button" class="eye-toggle" id="togglePassBtn"><i class="ph ph-eye" id="eyeIcon"></i></button>
                        <div class="field-hint" id="passwordHint"></div>
                    </div>
                    <div class="remember-row"><input type="checkbox" id="rememberMe"><label for="rememberMe">Remember me</label></div>
                    <div class="forgot-row"><a href="#" id="forgotLink">Forgot Password?</a></div>
                    <button type="button" class="btn-pill-primary" id="loginBtn"><span id="btnText">Sign In</span></button>
                </form>
                <div class="signup-row"><p>New to EliteEarn? <a href="index.html">Create Account</a></p></div>
            </div>
        </div>
    </main>
    <div id="elite-toast-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig={apiKey:"AIzaSyDMmFqRjoZC0jbp3z_uiL6l2553YsdWjzk",authDomain:"earnelite-94a5e.firebaseapp.com",projectId:"earnelite-94a5e",storageBucket:"earnelite-94a5e.firebasestorage.app",messagingSenderId:"343677058789",appId:"1:343677058789:web:776faceb824158042fde0c"};
        const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
        window._auth=auth;window._db=db;
        window._fbFns={doc,getDoc,updateDoc,serverTimestamp,signInWithEmailAndPassword,sendPasswordResetEmail,setPersistence,browserLocalPersistence,browserSessionPersistence,onAuthStateChanged};
        window._firebaseReady=true;

        // 🔑 Clear any previous session on page load
        sessionStorage.clear();
        localStorage.removeItem('eliteEarn_rememberedEmail');
        console.log('✅ Firebase ready - Previous session cleared');
    </script>

    <script>
        "use strict";
        function notify(s,m){let c=document.getElementById('elite-toast-container');if(!c){c=document.createElement('div');c.id='elite-toast-container';document.body.appendChild(c)}const t={success:{icon:'fa-solid fa-check-double',color:'#059669',bg:'#ECFDF5',title:'Success'},error:{icon:'fa-solid fa-circle-exclamation',color:'#DC2626',bg:'#FEF2F2',title:'Error'},warning:{icon:'fa-solid fa-triangle-exclamation',color:'#EA580C',bg:'#FFF7ED',title:'Warning'},info:{icon:'fa-solid fa-bell',color:'#8B5CF6',bg:'#EDE9FE',title:'Information'}};const th=t[s]||t.info;const toast=document.createElement('div');toast.className='elite-toast';toast.style.borderLeft=`4px solid ${th.color}`;toast.innerHTML=`<div class="elite-toast-icon" style="color:${th.color};background:${th.bg}"><i class="${th.icon}"></i></div><div class="elite-toast-body"><div class="elite-toast-title">${th.title}</div><div class="elite-toast-message">${m}</div></div><button class="elite-toast-close" onclick="this.closest('.elite-toast').remove()"><i class="fa-solid fa-xmark"></i></button>`;c.appendChild(toast);setTimeout(()=>toast.classList.add('show'),10);setTimeout(()=>{toast.classList.remove('show');setTimeout(()=>toast.remove(),300)},5000)}

        function togglePass(){const i=document.getElementById('loginPassword'),ic=document.getElementById('eyeIcon');if(i.type==='password'){i.type='text';ic.className='ph ph-eye-slash'}else{i.type='password';ic.className='ph ph-eye'}}
        document.getElementById('togglePassBtn').addEventListener('click',togglePass);

        function setLoading(l){const b=document.getElementById('loginBtn'),t=document.getElementById('btnText');b.disabled=l;t.innerHTML=l?'<span class="spinner"></span> Signing In…':'Sign In'}

        // Load remembered email
        const remembered=localStorage.getItem('eliteEarn_rememberedEmail');
        if(remembered){document.getElementById('loginEmail').value=remembered;document.getElementById('rememberMe').checked=true}

        // 🔑 MAIN LOGIN FUNCTION
        async function handleLogin(){
            if(!window._firebaseReady){notify('info','App is still loading…');return}
            const email=document.getElementById('loginEmail').value.trim();
            const pass=document.getElementById('loginPassword').value;
            if(!email){return notify('error','Please enter your email address.')}
            if(!pass){return notify('error','Please enter your password.')}
            setLoading(true);
            const{signInWithEmailAndPassword,setPersistence,browserLocalPersistence,browserSessionPersistence,doc,getDoc,updateDoc,serverTimestamp}=window._fbFns;
            const auth=window._auth,db=window._db;
            try{
                const rememberMe=document.getElementById('rememberMe').checked;
                await setPersistence(auth,rememberMe?browserLocalPersistence:browserSessionPersistence);
                const cred=await signInWithEmailAndPassword(auth,email,pass);
                const uid=cred.user.uid;
                console.log('✅ Login successful:',cred.user.email);

                // 🔑 Get full user data from Firestore
                const uidSnap=await getDoc(doc(db,'usersByUid',uid));
                let username='',userData=null;
                if(uidSnap.exists()){
                    username=uidSnap.data().username||'';
                    const userSnap=await getDoc(doc(db,'users',username));
                    if(userSnap.exists()){
                        userData=userSnap.data();
                        // Update last login
                        await updateDoc(doc(db,'users',username),{lastLogin:serverTimestamp(),lastLoginDate:new Date().toISOString()});
                    }
                }

                // Save remembered email
                if(rememberMe){localStorage.setItem('eliteEarn_rememberedEmail',email)}else{localStorage.removeItem('eliteEarn_rememberedEmail')}

                // 🔑 CRITICAL: Save ALL session data for dashboard
                sessionStorage.setItem('userLoggedIn','true');
                sessionStorage.setItem('userEmail',email);
                sessionStorage.setItem('userUid',uid);
                sessionStorage.setItem('username',username);
                if(userData){
                    sessionStorage.setItem('userData',JSON.stringify({
                        username:username,
                        email:email,
                        balance:(userData.depositWallet||0)+(userData.withdrawalWallet||0),
                        depositWallet:userData.depositWallet||0,
                        withdrawalWallet:userData.withdrawalWallet||0,
                        totalDeposited:userData.totalDeposited||0,
                        referralCount:userData.referralCount||0,
                        referralBonus:userData.referralBonus||0,
                        activePlan:userData.activePlan||'',
                        isAdmin:userData.isAdmin||false
                    }));
                }

                notify('success',`Welcome back${username?' '+username:''}!`);
                setTimeout(()=>{window.location.href='dashboard.html'},1200);

            }catch(err){
                setLoading(false);
                const messages={'auth/user-not-found':'No account with this email.','auth/wrong-password':'Incorrect password.','auth/invalid-credential':'Invalid email or password.','auth/too-many-requests':'Too many attempts. Try later.','auth/network-request-failed':'Network error.'};
                notify('error',messages[err.code]||err.message);
            }
        }

        // Forgot password
        async function handleForgot(e){e.preventDefault();const email=document.getElementById('loginEmail').value.trim();if(!email){return notify('warning','Enter your email first.')}try{await window._fbFns.sendPasswordResetEmail(window._auth,email);notify('success','Password reset email sent!')}catch(err){notify('error','Could not send reset email.')}}

        document.getElementById('loginBtn').addEventListener('click',handleLogin);
        document.getElementById('forgotLink').addEventListener('click',handleForgot);
        document.getElementById('loginPassword').addEventListener('keypress',e=>{if(e.key==='Enter')handleLogin()});
        window.handleLogin=handleLogin;
        console.log('✅ Login page ready');
    </script>
</body>
</html>
