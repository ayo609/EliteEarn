<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EliteEarn – Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --purple: #8B5CF6;
    --purple-dark: #6D28D9;
    --gold: #F59E0B;
    --gold-dark: #D97706;
    --white: #ffffff;
    --gray-50: #F9FAFB;
    --gray-200: #E5E7EB;
    --gray-400: #9CA3AF;
    --gray-600: #4B5563;
    --gray-900: #111827;
    --input-radius: 50px;
    --btn-radius: 50px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: linear-gradient(145deg, #1a0533 0%, #2d0a5e 40%, #4c1d95 70%, #6d28d9 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(245,158,11,0.25) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .hero {
    width: 100%;
    padding: 52px 28px 84px;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(245,158,11,0.18);
    border: 1px solid rgba(245,158,11,0.35);
    border-radius: 50px;
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .hero-badge::before { content: '✦'; font-size: 9px; }
  .hero-label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
    opacity: 0.9;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(40px, 10vw, 60px);
    font-weight: 700;
    color: #fff;
    line-height: 1.05;
  }
  .hero-title span { color: var(--gold); }
  .hero-sub {
    margin-top: 10px;
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    font-weight: 300;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 28px 28px 0 0;
    padding: 36px 28px 52px;
    position: relative;
    z-index: 2;
    flex: 1;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
    margin-top: -44px;
  }
  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 6px;
  }
  .card-subtitle {
    font-size: 13px;
    color: var(--gray-400);
    margin-bottom: 28px;
  }
  .field {
    position: relative;
    margin-bottom: 14px;
  }
  .field-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray-400);
    pointer-events: none;
    transition: color 0.2s;
  }
  .field input {
    width: 100%;
    height: 56px;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--input-radius);
    padding: 0 46px 0 48px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--gray-900);
    background: var(--gray-50);
    outline: none;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .field input::placeholder { color: var(--gray-400); }
  .field input:focus {
    border-color: var(--purple);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(139,92,246,0.12);
  }
  .eye-toggle {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--gray-400);
    background: none;
    border: none;
    padding: 4px;
    display: flex;
    align-items: center;
    transition: color 0.2s;
  }
  .eye-toggle:hover { color: var(--purple); }
  .forgot-row {
    text-align: right;
    margin: -4px 0 16px;
  }
  .forgot-row a {
    font-size: 12.5px;
    color: var(--purple);
    text-decoration: none;
    font-weight: 500;
  }
  .forgot-row a:hover { color: var(--gold); }
  .btn-primary {
    width: 100%;
    height: 56px;
    background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: var(--btn-radius);
    cursor: pointer;
    margin-top: 4px;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(109,40,217,0.35);
  }
  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 100%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .btn-primary:hover::after { opacity: 1; }
  .btn-primary span { position: relative; z-index: 1; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }
  .signup-row {
    text-align: center;
    font-size: 13.5px;
    color: var(--gray-600);
    margin-top: 20px;
  }
  .signup-row a {
    color: var(--purple);
    font-weight: 600;
    text-decoration: none;
    margin-left: 4px;
  }
  .signup-row a:hover { color: var(--gold); }
  #toast-container {
    position: fixed;
    top: 18px; left: 18px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 320px;
  }
  .toast {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--gray-900);
    color: #fff;
    padding: 13px 16px;
    border-radius: 12px;
    font-size: 13px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    animation: slideIn 0.3s ease;
    border-left: 3px solid var(--purple);
  }
  .toast.success { border-left-color: #10B981; }
  .toast.error { border-left-color: #EF4444; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">Investor Portal</div>
  <div class="hero-label">EliteEarn Platform</div>
  <h1 class="hero-title">Welcome<br/><span>Back!</span></h1>
  <p class="hero-sub">Sign in to manage your investments</p>
</div>

<div class="card">
  <h2 class="card-title">Sign In</h2>
  <p class="card-subtitle">Access your investor dashboard</p>

  <div class="field">
    <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
      <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
      <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
    </svg>
    <input type="email" id="email" placeholder="Email Address" required />
  </div>

  <div class="field">
    <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
      <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
    </svg>
    <input type="password" id="password" placeholder="Password" required />
    <button type="button" class="eye-toggle" onclick="toggleEye()">
      <svg id="eyeIcon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
        <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
        <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>

  <div class="forgot-row"><a href="#">Forgot password?</a></div>

  <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
    <span id="btnText">Sign In</span>
  </button>

  <p class="signup-row">New investor? <a href="signup.html">Create Account</a></p>
</div>

<div id="toast-container"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window._auth = auth;
  window._db = db;
  window._loginFns = { signInWithEmailAndPassword, collection, query, where, getDocs };
  window.dispatchEvent(new Event('firebaseReady'));
</script>

<script>
  function showToast(msg, type = 'info', duration = 4000) {
    const icons = { success: '✓', error: '✕', info: '◆' };
    const tc = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<span>${icons[type]||'◆'}</span><span>${msg}</span>`;
    tc.appendChild(t);
    setTimeout(() => t.remove(), duration);
  }

  function toggleEye() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function setLoading(v) {
    document.getElementById('loginBtn').disabled = v;
    document.getElementById('btnText').innerHTML = v ? '<span class="spinner"></span>Signing In…' : 'Sign In';
  }

  async function handleLogin() {
    if (!window._auth) return showToast('App loading…', 'info');
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;
    if (!email || !pass) return showToast('Please fill in all fields.', 'error');
    setLoading(true);
    try {
      const { signInWithEmailAndPassword } = window._loginFns;
      await signInWithEmailAndPassword(window._auth, email, pass);
      showToast('Welcome back! Redirecting…', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1500);
    } catch (err) {
      setLoading(false);
      const msgs = {
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/too-many-requests': 'Too many attempts. Try again later.',
        'auth/invalid-credential': 'Invalid email or password.'
      };
      showToast(msgs[err.code] || err.message, 'error');
    }
  }
  window.handleLogin = handleLogin;
  window.toggleEye = toggleEye;
</script>
</body>
</html>
